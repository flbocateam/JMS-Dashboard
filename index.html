<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMS Sales Intelligence — Wall Street</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Barlow+Condensed:wght@400;600;700;800;900&display=swap');

:root {
  --bg:       #040c18;
  --bg2:      #071020;
  --gold:     #c9a84c;
  --gold2:    #f0c040;
  --gold3:    #ffd700;
  --navy:     #0a1e3d;
  --blue:     #1a3a6e;
  --silver:   #8090a8;
  --green:    #00d97e;
  --red:      #e84040;
  --white:    #dce6f0;
  --muted:    #2d4060;
  --border:   rgba(201,168,76,.2);
  --glow:     0 0 24px rgba(201,168,76,.3);
  --glow-lg:  0 0 48px rgba(201,168,76,.45);
  --g-glow:   0 0 20px rgba(0,217,126,.35);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--white);
  width:100vw; height:100vh; overflow:hidden;
}

/* ── COVER SLIDE ── */
.slide-cover {
  background: radial-gradient(ellipse at 50% 42%, #071528 0%, var(--bg) 68%);
  background-image:
    repeating-linear-gradient(-60deg, transparent, transparent 40px, rgba(201,168,76,.02) 40px, rgba(201,168,76,.02) 41px),
    repeating-linear-gradient(30deg, transparent, transparent 60px, rgba(26,58,110,.02) 60px, rgba(26,58,110,.02) 61px);
}
.cover-body {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0 80px 50px; gap:0;
}
.cover-eyebrow { font-family:'Barlow Condensed',sans-serif; font-size:.78rem; font-weight:700; letter-spacing:.45em; color:var(--muted); text-transform:uppercase; margin-bottom:16px; }
.cover-rule-top { width:260px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin-bottom:22px; opacity:.55; }
.cover-brand {
  font-family:'Barlow Condensed',sans-serif; font-size:5.2rem; font-weight:900;
  letter-spacing:.32em; color:var(--gold2); text-transform:uppercase;
  text-shadow:var(--glow-lg); animation:gold-glow 4s ease-in-out infinite;
}
.cover-tagline { font-family:'Barlow Condensed',sans-serif; font-size:.86rem; font-weight:700; letter-spacing:.5em; color:var(--silver); text-transform:uppercase; margin-top:5px; }
.cover-period  { font-family:'Barlow Condensed',sans-serif; font-size:.78rem; color:var(--muted); letter-spacing:.18em; margin-top:7px; }
.cover-rule { width:520px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),var(--gold3),var(--gold),transparent); margin:22px 0; opacity:.55; }
.cover-kpis { display:flex; gap:16px; width:100%; max-width:900px; }
.cover-kpi {
  flex:1; text-align:center;
  background:rgba(201,168,76,.03); border:1px solid rgba(201,168,76,.12);
  border-radius:3px; padding:20px 12px 16px;
}
.cover-kpi-val { font-family:'Barlow Condensed',sans-serif; font-size:2.55rem; font-weight:900; letter-spacing:.02em; line-height:1; }
.cover-kpi-lbl { font-family:'Barlow Condensed',sans-serif; font-size:.76rem; font-weight:700; color:var(--silver); letter-spacing:.16em; text-transform:uppercase; margin-top:7px; }
.cover-kpi-sub { font-size:.67rem; color:var(--muted); margin-top:3px; letter-spacing:.04em; }
.cover-reps { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; justify-content:center; }
.cover-rep-pill { font-family:'Barlow Condensed',sans-serif; font-size:.8rem; font-weight:700; letter-spacing:.1em; border:1px solid; border-radius:2px; padding:5px 16px; }
.cover-hint { font-size:.66rem; color:var(--muted); letter-spacing:.14em; margin-top:18px; text-transform:uppercase; }

/* ── WALL STREET BACKGROUND TEXTURE ── */
.ws-bg {
  background-image:
    repeating-linear-gradient(-60deg, transparent, transparent 40px, rgba(201,168,76,.018) 40px, rgba(201,168,76,.018) 41px),
    repeating-linear-gradient(30deg, transparent, transparent 60px, rgba(26,58,110,.025) 60px, rgba(26,58,110,.025) 61px);
}

/* ── ANIMATIONS ── */
@keyframes glow-pulse    { 0%,100%{opacity:1} 50%{opacity:.65} }
@keyframes gold-glow     { 0%,100%{text-shadow:0 0 18px rgba(201,168,76,.35)} 50%{text-shadow:0 0 36px rgba(240,192,64,.7),0 0 60px rgba(201,168,76,.25)} }
@keyframes fade-in       { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes scanline      { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }
@keyframes shimmer-gold  { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
@keyframes tick          { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

/* ══════════════════════════════════
   PASSWORD GATE
══════════════════════════════════ */
#gate {
  position:fixed; inset:0; z-index:9999;
  background: radial-gradient(ellipse at center, #071528 0%, var(--bg) 70%);
  background-image:
    repeating-linear-gradient(-60deg, transparent, transparent 40px, rgba(201,168,76,.02) 40px, rgba(201,168,76,.02) 41px),
    repeating-linear-gradient(30deg, transparent, transparent 60px, rgba(26,58,110,.02) 60px, rgba(26,58,110,.02) 61px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  overflow:hidden;
}
.gate-scanline {
  position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.25),transparent);
  animation:scanline 5s linear infinite;
  pointer-events:none;
}
.gate-rule-top {
  width:260px; height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.5;
}
.gate-brand {
  font-family:'Barlow Condensed',sans-serif;
  font-size:3.6rem; font-weight:900; letter-spacing:.25em;
  color:var(--gold2); text-transform:uppercase;
  text-shadow: var(--glow-lg);
  animation: gold-glow 4s ease-in-out infinite;
}
.gate-tagline {
  font-family:'Barlow Condensed',sans-serif;
  font-size:.88rem; font-weight:700; letter-spacing:.5em;
  color:var(--silver); text-transform:uppercase;
  margin-top:-12px;
}
.gate-rule {
  width:320px; height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--gold3),var(--gold),transparent);
  opacity:.6;
}
.gate-sub {
  font-family:'Barlow Condensed',sans-serif;
  font-size:.78rem; color:var(--muted); letter-spacing:.22em;
  text-transform:uppercase;
}
.gate-box {
  background:rgba(201,168,76,.03); border:1px solid var(--border);
  border-radius:3px; padding:36px 44px;
  display:flex; flex-direction:column; align-items:center; gap:16px; width:360px;
  box-shadow: inset 0 0 40px rgba(201,168,76,.03), 0 0 40px rgba(10,30,61,.6);
}
.gate-label {
  font-family:'Barlow Condensed',sans-serif;
  font-size:.76rem; color:var(--silver); letter-spacing:.22em;
  text-transform:uppercase; align-self:flex-start;
}
.gate-input {
  width:100%; background:rgba(201,168,76,.03); border:1px solid rgba(201,168,76,.25);
  border-radius:2px; padding:14px 18px; color:var(--gold2); font-size:1.1rem;
  font-family:'Barlow Condensed',sans-serif; letter-spacing:.18em;
  outline:none; transition:all .2s;
}
.gate-input:focus { border-color:var(--gold2); box-shadow:0 0 14px rgba(201,168,76,.2); }
.gate-btn {
  width:100%;
  background:linear-gradient(90deg,#6b4d0a,var(--gold),var(--gold3),var(--gold),#6b4d0a);
  background-size:200% 100%; animation:shimmer-gold 3s linear infinite;
  border:none; border-radius:2px; padding:15px;
  color:#040c18; font-family:'Barlow Condensed',sans-serif;
  font-size:1.1rem; font-weight:900; letter-spacing:.26em; cursor:pointer;
  text-transform:uppercase; transition:opacity .2s;
  box-shadow: var(--glow);
}
.gate-btn:hover { opacity:.9; box-shadow:var(--glow-lg); }
.gate-error { font-size:.8rem; color:var(--red); display:none; letter-spacing:.08em; }
.gate-error.show { display:block; }

/* ══════════════════════════════════
   CORE LAYOUT
══════════════════════════════════ */
.slideshow { width:100%; height:100%; position:relative; }
.slide {
  position:absolute; inset:0; display:flex; flex-direction:column;
  opacity:0; transform:translateY(10px);
  transition:opacity .55s ease, transform .55s ease;
  pointer-events:none;
}
.slide.active { opacity:1; transform:translateY(0); pointer-events:all; }
.slide.exit   { opacity:0; transform:translateY(-8px); }

.progress-bar {
  position:fixed; bottom:0; left:0; height:3px;
  background:linear-gradient(90deg,#3a2800,var(--gold),var(--gold3),var(--gold2),#3a2800);
  width:0%; z-index:100;
  box-shadow:0 0 10px rgba(201,168,76,.6);
}
.indicators { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:100; }
.dot {
  width:7px; height:7px; border-radius:50%; background:rgba(201,168,76,.18);
  transition:all .4s; cursor:pointer; position:relative;
}
.dot.active { background:var(--gold2); transform:scale(1.5); box-shadow:0 0 8px rgba(240,192,64,.5); }
.dot:hover::after {
  content: attr(data-name);
  position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
  background:rgba(4,12,24,.95); border:1px solid rgba(201,168,76,.25);
  color:var(--gold2); font-family:'Barlow Condensed',sans-serif;
  font-size:.68rem; font-weight:700; letter-spacing:.1em;
  white-space:nowrap; padding:4px 10px; border-radius:2px;
  pointer-events:none; z-index:200;
}

/* ── SLIDE NAME FLASH ── */
#slideNameFlash {
  position:fixed; top:46px; left:50%; transform:translateX(-50%);
  font-family:'Barlow Condensed',sans-serif; font-size:.72rem; font-weight:700;
  letter-spacing:.3em; color:var(--gold); text-transform:uppercase;
  background:rgba(4,12,24,.88); border:1px solid rgba(201,168,76,.2);
  padding:5px 18px; border-radius:2px; opacity:0;
  transition:opacity .3s ease; pointer-events:none; z-index:200;
}
#slideNameFlash.snf-show  { opacity:1; }
#slideNameFlash.snf-hide  { opacity:0; transition:opacity .9s ease; }

/* ── SLIDE COUNTER ── */
#slideCounter {
  position:fixed; bottom:30px; right:20px;
  font-family:'Barlow Condensed',sans-serif; font-size:.72rem; font-weight:700;
  letter-spacing:.12em; color:rgba(201,168,76,.35); z-index:100;
  pointer-events:none;
}

/* ── GLOBAL CHART TOOLTIP ── */
#chartTip {
  position:fixed; pointer-events:none; z-index:500;
  background:rgba(4,12,24,.96); border:1px solid rgba(201,168,76,.3);
  color:var(--white); font-family:'Barlow Condensed',sans-serif;
  font-size:.78rem; font-weight:600; letter-spacing:.06em;
  padding:6px 12px; border-radius:3px; opacity:0;
  transition:opacity .15s ease; white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}
#chartTip.ct-show { opacity:1; }

/* ── THEME TOGGLE ── */
#themeToggle {
  position:fixed; top:46px; right:16px; z-index:200;
  background:rgba(201,168,76,.08); border:1px solid rgba(201,168,76,.2);
  color:var(--gold); font-size:.9rem; cursor:pointer;
  padding:5px 9px; border-radius:3px; transition:all .2s;
  line-height:1;
}
#themeToggle:hover { background:rgba(201,168,76,.18); box-shadow:var(--glow); }

/* ══════════════════════════════════
   LIGHT MODE
══════════════════════════════════ */
body.light-mode {
  --bg:     #f0f4f8;
  --bg2:    #e4ecf4;
  --gold:   #8a6a10;
  --gold2:  #a07810;
  --gold3:  #b88c14;
  --navy:   #dce8f4;
  --blue:   #c8daf0;
  --silver: #4a5a72;
  --green:  #007a44;
  --red:    #b82020;
  --white:  #0a1e3d;
  --muted:  #7a90a8;
  --border: rgba(10,30,61,.15);
  --glow:   0 0 16px rgba(138,106,16,.2);
  --glow-lg:0 0 32px rgba(138,106,16,.3);
}
body.light-mode .gate-brand,
body.light-mode .cover-brand { color:var(--gold2); }
body.light-mode .slide-hdr  { background:rgba(240,244,248,.85); }
body.light-mode .ws-bg      { background-color:var(--bg); }
body.light-mode .ticker     { background:rgba(240,244,248,.97); border-bottom-color:rgba(10,30,61,.15); }
body.light-mode #tickerTimestamp { background:rgba(240,244,248,.97); border-left-color:rgba(10,30,61,.15); }
body.light-mode #slideNameFlash { background:rgba(240,244,248,.95); color:var(--gold2); }
body.light-mode #themeToggle { background:rgba(10,30,61,.06); border-color:rgba(10,30,61,.2); color:var(--gold2); }

/* ══════════════════════════════════
   TICKER
══════════════════════════════════ */
.ticker {
  position:fixed; top:0; left:0; right:0; height:38px;
  background:rgba(4,12,24,.97); border-bottom:1px solid rgba(201,168,76,.2);
  backdrop-filter:blur(10px); display:flex; align-items:center; overflow:hidden; z-index:50;
}
.ticker-scroll { flex:1; overflow:hidden; min-width:0; }
.ticker-inner { display:flex; gap:50px; white-space:nowrap; animation:tick 40s linear infinite; padding-left:50px; }
#tickerTimestamp {
  flex-shrink:0; display:flex; align-items:center; gap:8px;
  padding:0 14px; height:100%; border-left:1px solid rgba(201,168,76,.15);
  background:rgba(4,12,24,.97);
}
#tickerTimestamp .ts-dot {
  width:6px; height:6px; border-radius:50%; background:var(--green);
  animation:live-pulse 2s ease-in-out infinite; flex-shrink:0;
}
#tickerTimestamp .ts-text {
  font-family:'Barlow Condensed',sans-serif; font-size:.72rem; font-weight:700;
  letter-spacing:.1em; color:var(--silver); white-space:nowrap;
}
#tickerTimestamp .ts-text strong { color:var(--gold2); }
.ticker-item { font-size:.78rem; letter-spacing:.04em; color:rgba(201,168,76,.45); }
.ticker-item strong { color:var(--white); font-weight:700; }
.ticker-item .sym { font-family:'Barlow Condensed',sans-serif; font-size:.82rem; font-weight:900; letter-spacing:.1em; color:var(--gold2); margin-right:5px; }
.ti-up { color:var(--green); font-weight:700; }
.ti-dn { color:var(--red); }

/* ══════════════════════════════════
   SHARED HEADER
══════════════════════════════════ */
.slide-header {
  margin-top:38px; padding:16px 56px;
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid rgba(201,168,76,.12); flex-shrink:0;
  background:rgba(4,12,24,.6);
}
.brand {
  font-family:'Barlow Condensed',sans-serif;
  font-size:2rem; font-weight:900; letter-spacing:.22em;
  color:var(--gold2); text-transform:uppercase;
  text-shadow:var(--glow);
}
.brand-sm {
  font-family:'Barlow Condensed',sans-serif;
  font-size:1rem; font-weight:700; letter-spacing:.2em; color:var(--muted);
}
.hdr-center { font-size:.88rem; color:var(--silver); letter-spacing:.08em; font-weight:500; font-family:'Barlow Condensed',sans-serif; }
.hdr-badge {
  background:rgba(201,168,76,.07); border:1px solid var(--border);
  border-radius:2px; padding:7px 20px; font-size:.92rem;
  color:var(--gold2); font-weight:900; letter-spacing:.08em;
  font-family:'Barlow Condensed',sans-serif;
  box-shadow:inset 0 0 16px rgba(201,168,76,.04);
}
.period-badge {
  font-family:'Barlow Condensed',sans-serif;
  font-size:.76rem; font-weight:900; letter-spacing:.16em;
  color:var(--bg); background:var(--gold);
  border-radius:2px; padding:4px 12px;
}

/* ══════════════════════════════════
   SLIDE: TEAM LEADERBOARD
══════════════════════════════════ */
.slide-lb {
  background: radial-gradient(ellipse at 25% 50%, #071528 0%, var(--bg) 70%);
  background-image:
    repeating-linear-gradient(-60deg, transparent, transparent 40px, rgba(201,168,76,.018) 40px, rgba(201,168,76,.018) 41px),
    repeating-linear-gradient(30deg, transparent, transparent 60px, rgba(26,58,110,.02) 60px, rgba(26,58,110,.02) 61px);
}
.lb-body { flex:1; display:flex; flex-direction:column; justify-content:center; padding:16px 56px 50px; gap:12px; }
.lb-row {
  display:grid; grid-template-columns:52px 1fr 148px 168px 88px;
  align-items:center; gap:18px;
  background:rgba(201,168,76,.025); border:1px solid rgba(201,168,76,.1);
  border-left:4px solid rgba(201,168,76,.18);
  border-radius:2px; padding:18px 24px;
}
.lb-row.r1 {
  background:linear-gradient(90deg,rgba(201,168,76,.1),rgba(201,168,76,.025));
  border-color:rgba(201,168,76,.35); border-left-color:var(--gold2);
  box-shadow:inset 0 0 30px rgba(201,168,76,.04), 0 0 20px rgba(201,168,76,.08);
}
.lb-row.r2 { border-left-color:#8090a8; border-color:rgba(128,144,168,.2); }
.lb-row.r3 { border-left-color:#cd7f32; border-color:rgba(205,127,50,.18); }
.lb-row.r4 { border-left-color:rgba(201,168,76,.25); }
.rank-ico { font-size:1.9rem; text-align:center; }
.rep-name { font-family:'Barlow Condensed',sans-serif; font-size:1.5rem; font-weight:800; letter-spacing:.04em; color:var(--white); }
.rep-sub { font-size:.78rem; color:var(--silver); margin-top:3px; letter-spacing:.02em; }
.bar-bg { height:6px; background:rgba(201,168,76,.08); border-radius:2px; overflow:hidden; }
.bar-fill { height:100%; border-radius:2px; }
.r1 .bar-fill { background:linear-gradient(90deg,#6b4d0a,var(--gold2)); box-shadow:0 0 6px rgba(201,168,76,.4); }
.r2 .bar-fill { background:linear-gradient(90deg,#3a4050,#8090a8); }
.r3 .bar-fill { background:linear-gradient(90deg,#5a3010,#cd7f32); }
.r4 .bar-fill { background:linear-gradient(90deg,#1a2a1a,#3a5a3a); }
.lb-rev {
  font-family:'Barlow Condensed',sans-serif; text-align:right;
  font-size:1.9rem; font-weight:900; letter-spacing:.02em;
  animation: gold-glow 4s ease-in-out infinite;
}
.r1 .lb-rev { color:var(--gold2); }
.r2 .lb-rev { color:var(--silver); }
.r3 .lb-rev { color:#cd7f32; }
.r4 .lb-rev { color:rgba(201,168,76,.65); animation:none; }
.lb-ord { text-align:right; }
.lb-ord .ord-num { font-family:'Barlow Condensed',sans-serif; font-size:1.12rem; font-weight:700; color:var(--silver); }
.lb-ord .ord-lbl { font-size:.68rem; color:var(--muted); margin-top:2px; letter-spacing:.08em; text-transform:uppercase; }

/* ══════════════════════════════════
   SLIDE: WEEKLY TREND
══════════════════════════════════ */
.slide-trend {
  background: radial-gradient(ellipse at 70% 30%, #071528 0%, var(--bg) 65%);
  background-image: repeating-linear-gradient(-60deg, transparent, transparent 40px, rgba(201,168,76,.018) 40px, rgba(201,168,76,.018) 41px);
}
.trend-body { flex:1; display:grid; grid-template-columns:1fr 310px; }
.trend-chart-panel { padding:22px 40px 50px 56px; display:flex; flex-direction:column; border-right:1px solid rgba(201,168,76,.1); }
.panel-title { font-family:'Barlow Condensed',sans-serif; font-size:.88rem; font-weight:700; color:var(--silver); letter-spacing:.16em; text-transform:uppercase; margin-bottom:18px; }
.weekly-bars { display:flex; align-items:flex-end; gap:8px; flex:1; }
.wk-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
.wk-bar-wrap { flex:1; width:100%; display:flex; align-items:flex-end; }
.wk-bar { width:100%; border-radius:2px 2px 0 0; min-height:3px; }
.wk-bar.peak { box-shadow:0 0 16px rgba(201,168,76,.5); }
.wk-bar.current { box-shadow:0 0 12px rgba(0,217,126,.4); }
.wk-val { font-family:'Barlow Condensed',sans-serif; font-size:.76rem; color:rgba(201,168,76,.6); font-weight:700; white-space:nowrap; }
.wk-lbl { font-size:.64rem; color:var(--muted); white-space:nowrap; }
.wk-lbl.hl { color:var(--green); font-weight:700; }
.trend-stats-panel { padding:26px 28px; display:flex; flex-direction:column; gap:12px; justify-content:center; }
.trend-stat-card {
  background:rgba(201,168,76,.03); border:1px solid rgba(201,168,76,.1);
  border-left:4px solid var(--gold); border-radius:2px; padding:16px 18px;
}
.tsc-label { font-family:'Barlow Condensed',sans-serif; font-size:.76rem; color:var(--silver); letter-spacing:.16em; text-transform:uppercase; margin-bottom:6px; }
.tsc-val { font-family:'Barlow Condensed',sans-serif; font-size:2rem; font-weight:900; letter-spacing:.02em; }
.tsc-sub { font-size:.76rem; color:var(--silver); margin-top:4px; }
.g { color:var(--green); } .r { color:var(--red); } .gd { color:var(--gold2); } .wh { color:var(--white); }

/* ══════════════════════════════════
   SLIDE: INDIVIDUAL REP
══════════════════════════════════ */
.rep-body { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
.panel {
  padding:28px 44px; border-right:1px solid rgba(201,168,76,.08); border-bottom:1px solid rgba(201,168,76,.08);
  display:flex; flex-direction:column; justify-content:center;
}

  background:rgba(201,168,76,.04); border:1px solid rgba(201,168,76,.18);
  border-radius:4px; padding:14px 18px 10px;
}

  position:relative; height:22px; background:rgba(255,255,255,.06);
  border-radius:3px; overflow:visible;
}

  height:100%; border-radius:3px;
  background:linear-gradient(90deg,#c9a84c,#f0c040,#ffd700);
  position:relative; overflow:hidden;
  transition:width 1.2s cubic-bezier(.22,1,.36,1);
  box-shadow:0 0 16px rgba(240,192,64,.4);
}

function buildTicker() {
  const now = new Date();

    return `<span class="ticker-item"><span class="sym">${r.sym}</span><strong>${r.name}</strong> &nbsp;${fmtFull(r.revenue)}&nbsp; <span class="${up?'ti-up':'ti-dn'}">${up?'▲':'▼'} ${fmt(Math.abs(last-prev))}</span> &nbsp;·&nbsp; ${r.orders.toLocaleString()} orders &nbsp;·&nbsp; ${r.clinics} accounts</span>`;

// ── SPARKLINE HELPER ──────────────────────────────────────────────
function sparkline(data, color, idx, w=138, h=30) {
  const maxV = Math.max(...data), minV = Math.min(...data);
  const range = maxV - minV || 1;
  const pad = 3, iW = w - pad*2, iH = h - pad*2;
  const coords = data.map((v,i) => ({
    x: (i/(data.length-1))*iW + pad,
    y: h - pad - ((v-minV)/range*iH)
  }));
  const line  = coords.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area  = line + ` ${coords[coords.length-1].x.toFixed(1)},${h-1} ${coords[0].x.toFixed(1)},${h-1}`;
  const last  = coords[coords.length-1];
  const gid   = `spk${idx}`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px;overflow:visible;vertical-align:middle;display:block">
    <defs>
      <linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    <polygon points="${area}" fill="url(#${gid})"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.6"
              stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="2.8" fill="${color}"/>
  </svg>`;
}

  const avgTot  = Math.round(weeks.reduce((s,w)=>s+w.tot,0)/weeks.length);
  const up = lastTot > prevTot;
  const bars = weeks.map((w,i) => {
    const h = pct(w.tot, maxTot);
    const isPeak = i===peakIdx, isCur = i===weeks.length-1;
    const shade = Math.round(40 + (i/weeks.length)*140);
    const color = isPeak   ? 'background:linear-gradient(180deg,var(--gold3),#6b4d0a)' :

function slideMoM() {
  const COLORS = ['#f0c040','#8090a8','#00d4ff','#a78bfa'];
  const SHORT  = ['Erin','Zachary','Dylan','Jonathan'];

  // Monthly totals per rep (weeks 0-3=Mar, 4-7=Apr, 8-11=May)
  const rm = reps.map((r,i) => {
    const mar = r.weekly.slice(0,4).reduce((s,v)=>s+v,0);
    const apr = r.weekly.slice(4,8).reduce((s,v)=>s+v,0);
    const may = r.weekly.slice(8,12).reduce((s,v)=>s+v,0);
    return { ...r, mar, apr, may, color:COLORS[i], short:SHORT[i] };
  });

  const teamMar = rm.reduce((s,r)=>s+r.mar,0);
  const teamApr = rm.reduce((s,r)=>s+r.apr,0);
  const teamMay = rm.reduce((s,r)=>s+r.may,0);
  const maxTeam = Math.max(teamMar,teamApr,teamMay);
  const BAR_H   = 215;

  const bh = v => Math.max(10, v/maxTeam*BAR_H);

  function buildBar(monthTotal, key, label) {
    const h = bh(monthTotal);
    const segs = rm.map(r => {
      const rv = r[key];
      const sh = Math.max(2, rv/monthTotal*h);
      return `<div style="height:${sh.toFixed(1)}px;background:${r.color};flex-shrink:0;"></div>`;
    }).join('');
    return `<div class="mom-bar-group">
      <div class="mom-total" data-cu="${monthTotal}">${fmt(monthTotal)}</div>
      <div class="mom-bar" style="height:${h.toFixed(1)}px;">${segs}</div>
      <div class="mom-month-lbl">${label}</div>
    </div>`;
  }

  function arrow(a, b) {
    const p = ((b-a)/a*100);
    const up = p >= 0;
    const c  = up ? 'var(--green)' : 'var(--red)';
    const bc = up ? 'rgba(0,217,126,.22)' : 'rgba(232,64,64,.18)';
    return `<div class="mom-arrow-col">
      <div class="mom-growth" style="color:${c};border-color:${bc};">${up?'▲':'▼'} ${up?'+':''}${p.toFixed(1)}%</div>
    </div>`;
  }

  const chart = `
    <div class="panel-title" style="margin-bottom:0">Team Revenue — Stacked by Rep &nbsp;<span style="color:var(--silver);font-size:.7rem">* May through May 24</span></div>
    <div class="mom-legend" style="margin-top:10px">
      ${rm.map(r=>`<span class="mom-leg-item"><span class="mom-leg-dot" style="background:${r.color}"></span>${r.short}</span>`).join('')}
    </div>
    <div class="mom-bars-row">
      ${buildBar(teamMar,'mar','March')}
      ${arrow(teamMar,teamApr)}
      ${buildBar(teamApr,'apr','April')}
      ${arrow(teamApr,teamMay)}
      ${buildBar(teamMay,'may','May*')}
    </div>`;

  const cards = rm.map(r => {
    const maUp = r.apr >= r.mar, amUp = r.may >= r.apr;
    const maPct = ((r.apr-r.mar)/r.mar*100).toFixed(1);
    const amPct = ((r.may-r.apr)/r.apr*100).toFixed(1);
    return `<div class="mom-rep-card" style="border-left-color:${r.color}">
      <div class="mom-rep-header">
        <span class="mom-rep-name" style="color:${r.color}">${r.name}</span>
        <span class="mom-rep-sym">${r.sym}</span>
      </div>
      <div class="mom-rep-row">
        <div class="mom-rep-month"><div class="mom-rep-lbl">Mar</div><div class="mom-rep-val">${fmt(r.mar)}</div></div>
        <div class="mom-trend-arrow ${maUp?'up':'dn'}">${maUp?'▲':'▼'}<br>${maUp?'+':''}${maPct}%</div>
        <div class="mom-rep-month"><div class="mom-rep-lbl">Apr</div><div class="mom-rep-val">${fmt(r.apr)}</div></div>
        <div class="mom-trend-arrow ${amUp?'up':'dn'}">${amUp?'▲':'▼'}<br>${amUp?'+':''}${amPct}%</div>
        <div class="mom-rep-month"><div class="mom-rep-lbl">May*</div><div class="mom-rep-val">${fmt(r.may)}</div></div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="slide slide-mom" id="smom">
    <div class="slide-header">
      <div class="brand">JMS SALES</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="hdr-center">Month-over-Month Trajectory</div>
        <div class="period-badge">MAR – MAY 2026</div>
      </div>
      <div class="hdr-badge" data-cu="${totalRevenue}">YTD &nbsp; ${fmt(totalRevenue)}</div>
    </div>
    <div class="mom-body">
      <div class="mom-left">${chart}</div>
      <div class="mom-right">
        <div class="mom-right-title">Rep Trajectories</div>
        ${cards}
        <div class="mom-footnote">* May data through May 24, 2026 · 4 weeks recorded</div>
      </div>
    </div>
  </div>`;
}

function slideScorecard() {
  const COLORS = ['#f0c040','#8090a8','#00d4ff','#a78bfa'];

  // Compute Apr & May totals for trend
  const rm = reps.map((r,i) => {
    const apr = r.weekly.slice(4,8).reduce((s,v)=>s+v,0);
    const may = r.weekly.slice(8,12).reduce((s,v)=>s+v,0);
    const trend = (may - apr) / apr * 100;
    return { ...r, apr, may, trend, color:COLORS[i] };
  });

  // Metric definitions: label, sub-label, value extractor, format fn, isTrend flag
  const metrics = [
    { label:'YTD Revenue',       sub:'Total billed Mar–May',
      get:(r)=>r.revenue,        fmt_:(v)=>fmt(v),      cu:true,  trend:false },
    { label:'Revenue / Account', sub:'Avg revenue per clinic',
      get:(r)=>r.revenue/r.clinics, fmt_:(v)=>fmt(v),   cu:true,  trend:false },
    { label:'Revenue / Order',   sub:'Average ticket size',
      get:(r)=>r.revenue/r.orders,  fmt_:(v)=>fmt(v),   cu:true,  trend:false },
    { label:'Orders / Account',  sub:'Account engagement depth',
      get:(r)=>r.orders/r.clinics,  fmt_:(v)=>v.toFixed(1)+'x', cu:false, trend:false },
    { label:'New Accounts',      sub:'Total closed YTD',
      get:(r)=>r.newClinics.mar+r.newClinics.apr+r.newClinics.may,
      fmt_:(v)=>v.toString(),    cu:false, trend:false },
    { label:'May Active',        sub:'Accounts active in May',
      get:(r)=>r.activeClinics.may, fmt_:(v)=>v.toString(), cu:false, trend:false },
    { label:'Apr → May',         sub:'* May through May 24',
      get:(r)=>r.trend,
      fmt_:(v)=>(v>=0?'+':'')+v.toFixed(1)+'%',         cu:false, trend:true  },
  ];

  // Header row: blank label cell + 4 rep cells
  const headerRow = `
    <div class="sc-cell sc-label-col" style="border-bottom:2px solid rgba(201,168,76,.25);">
      <div class="sc-label-text" style="color:var(--gold2);font-size:.88rem;">Metric</div>
    </div>
    ${rm.map((r,i)=>`
    <div class="sc-cell sc-rep-header" style="border-bottom:2px solid ${r.color};">
      <div class="sc-rep-name" style="color:${r.color}">${r.name.split(' ')[0]}</div>
      <div class="sc-rep-meta">${r.sym} &nbsp;·&nbsp; Rank #${r.rank}</div>
    </div>`).join('')}`;

  // Metric rows
  const metricRows = metrics.map((m,mi) => {
    const vals = rm.map(r => m.get(r));
    const best = m.trend ? Math.max(...vals) : Math.max(...vals);
    const isAlt = mi % 2 === 1;

    const labelCell = `<div class="sc-cell sc-label-col ${isAlt?'sc-alt':''}">
      <div class="sc-label-text">${m.label}</div>
      <div class="sc-label-sub">${m.sub}</div>
    </div>`;

    const dataCells = vals.map((v,i) => {
      const winner = m.trend ? (v === best && v > 0) : (v === best);
      const trendCls = m.trend ? (v >= 0 ? 'sc-up' : 'sc-dn') : '';
      const cuAttr = (m.cu && !m.trend) ? `data-cu="${v}"` : '';
      return `<div class="sc-cell ${winner?'sc-winner':''} ${isAlt?'sc-alt':''}">
        <div class="sc-val ${trendCls}" ${cuAttr}>${m.fmt_(v)}</div>
        <div class="${winner?'sc-winner-badge':'sc-blank-badge'}">${winner?'★ Leader':'—'}</div>
      </div>`;
    }).join('');

    return labelCell + dataCells;
  }).join('');

  return `
  <div class="slide slide-sc" id="ssc">
    <div class="slide-header">
      <div class="brand">JMS SALES</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="hdr-center">Rep Efficiency Scorecard</div>
        <div class="period-badge">MAR – MAY 2026</div>
      </div>
      <div class="hdr-badge">4 Active Reps</div>
    </div>
    <div class="sc-body">
      <div class="sc-table">${headerRow}${metricRows}</div>
      <div class="sc-footnote">* Apr → May trend uses weeks 35–38 vs weeks 31–34 · May data through May 24, 2026</div>
    </div>
  </div>`;
}

// ─── COUNT-UP ENGINE ──────────────────────────────────────────────
function countUp(el, target, duration=950) {
  const start    = performance.now();
  const isSmall  = target < 100;   // treat as integer (Rx counts etc.)
  const isPlain  = el.hasAttribute('data-cu-plain'); // no $ sign
  const fmtVal   = v => isPlain
    ? Math.round(v).toLocaleString('en-US')
    : (isSmall ? Math.round(v).toString() : fmt(v));
  function update(now) {
    const p    = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtVal(target * ease);
    if (p < 1) requestAnimationFrame(update);
    else el.textContent = fmtVal(target);
  }
  requestAnimationFrame(update);
}
function triggerCountUps(slide) {
  slide.querySelectorAll('[data-cu]').forEach(el => {
    countUp(el, parseFloat(el.getAttribute('data-cu')));
  });
}

// ─── SLIDESHOW CONTROLS ───────────────────────────────────────────
let cur=0, total=0, timer=null, paused=false;

function goTo(n) {
  const slides = document.querySelectorAll('.slide');
  slides.forEach((s,i) => {
    const becoming = i === n;
    s.classList.toggle('active', becoming);
    s.classList.remove('exit');
    if (!becoming && s.classList.contains('active')) s.classList.add('exit');
    if (becoming) triggerCountUps(s);
  });
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===n));
  // slide counter
  const sc = document.getElementById('slideCounter');
  if (sc) sc.textContent = `${n+1} / ${total}`;
  // slide name flash
  const name = SLIDE_NAMES[n] || '';
  if (name) {
    const fl = document.getElementById('slideNameFlash');
    fl.textContent = name.toUpperCase();
    fl.classList.remove('snf-hide'); fl.classList.add('snf-show');
    clearTimeout(fl._t);
    fl._t = setTimeout(() => { fl.classList.remove('snf-show'); fl.classList.add('snf-hide'); }, 1400);
  }
  cur=n;
  if (!paused) startProgress();
}
function next() { goTo((cur+1)%total); }
function prev() { clearTimeout(timer); goTo((cur-1+total)%total); }
function startProgress() {
  clearTimeout(timer);
  const bar = document.getElementById('progressBar');
  bar.style.transition='none'; bar.style.width='0%';
  bar.offsetWidth;
  bar.style.transition=`width ${DURATION}ms linear`; bar.style.width='100%';
  timer = setTimeout(next, DURATION);
}
function pauseProgress() {
  paused = true;
  clearTimeout(timer);
  const bar = document.getElementById('progressBar');
  const computed = getComputedStyle(bar).width;
  const parentW  = bar.parentElement.offsetWidth;
  const pct      = parseFloat(computed) / parentW * 100;
  bar.style.transition = 'none';
  bar.style.width = pct + '%';
}
function resumeProgress() {
  paused = false;
  startProgress();
}

function buildIndicators(n) {
  document.getElementById('indicators').innerHTML =
    Array.from({length:n},(_,i)=>`<div class="dot" onclick="goTo(${i})" data-name="${SLIDE_NAMES[i]||'Slide '+(i+1)}"></div>`).join('');
}

// ─── GITHUB TIMESTAMP ────────────────────────────────────────────
// Fetches the exact moment index.html was last pushed to GitHub.
// Falls back to the build timestamp embedded below if the API is unavailable.
const BUILD_TIMESTAMP = "2026-05-28"; // updated each time file is generated

function loadGitHubTimestamp() {
  const el = document.getElementById('tsText');
  const REPO = 'flbocateam/JMS-Dashboard';
  const FILE = 'index.html';
  fetch(`https://api.github.com/repos/${REPO}/commits?path=${FILE}&per_page=1`)
    .then(r => {
      if (!r.ok) throw new Error('API error');
      return r.json();
    })
    .then(data => {
      if (!data || !data[0]) throw new Error('No commits');
      const pushed = new Date(data[0].commit.committer.date);
      const formatted = pushed.toLocaleDateString('en-US', {
        month:'short', day:'numeric', year:'numeric'
      }) + ' · ' + pushed.toLocaleTimeString('en-US', {
        hour:'2-digit', minute:'2-digit', timeZoneName:'short'
      });
      el.innerHTML = `Data updated <strong>${formatted}</strong>`;
    })
    .catch(() => {
      // Fallback: show build timestamp embedded at generation time
      el.innerHTML = `Data updated <strong>${BUILD_TIMESTAMP}</strong>`;
    });
}

// Auto-pause on hover
document.addEventListener('DOMContentLoaded', () => {
  const ss = document.getElementById('slideshow');
  ss.addEventListener('mouseenter', pauseProgress);
  ss.addEventListener('mouseleave', resumeProgress);
});

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key===' ') { paused=false; next(); }
  if (e.key==='ArrowLeft')               { paused=false; prev(); }
});
