<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JMS Sales Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090d;--bg2:#0f1018;--bg3:#141820;
  --gold:#c9a227;--gold2:#a07c10;--gold3:#f0d060;
  --cream:#ede8dc;--cream2:#c8c0ae;
  --orange:#ff8c3a;--orange2:#e06010;
  --c0:#c9a227;--c1:#4a9eca;--c2:#3dba6d;--c3:#c47a3e;
  --up:#27ae60;--dn:#ff5252;
  --border:rgba(201,162,39,.13);
  --glass:rgba(201,162,39,.04);
}
body.light{
  --bg:#f5f0e8;--bg2:#ede8dc;--bg3:#e0d8c8;
  --cream:#1a1510;--cream2:#3a3020;
  --border:rgba(100,80,20,.18);
  --glass:rgba(100,80,20,.06);
}
body.light #ticker{background:rgba(30,20,10,.88);border-bottom:1px solid rgba(100,80,20,.3);}
body.light .map-sidebar{background:rgba(20,14,4,.82);}
body.light .map-state-name{color:#e8d9b0;}
body.light .map-state-rank{color:#c8b888;}
body.light .ticker-item{color:#e8d9b0;}
body.light .ticker-item strong{color:#fff;}
body.light .ticker-label{color:var(--orange);}
/* ── Light mode: Monthly Revenue Trajectory ── */
body.light .mom-rc-lbl{color:rgba(60,40,0,.55);}
body.light .mom-rc-bar{background:rgba(0,0,0,.1);}
body.light .mom-legend-item{color:#3a3020;}
body.light .slide-badge{color:#7a5500;border-color:rgba(100,70,0,.3);}
.gold-text{color:var(--gold);}
body.light .gold-text{color:#7a5500;}
/* ── Light mode: Momentum Board gold → dark amber for readability ── */
body.light .mb-team-lbl{color:#7a5500;}
body.light .mb-tc-val{color:#7a5500;}
body.light .mb-team-strip{border-color:rgba(100,70,0,.35);}
body.light .mb-row.on-fire{border-color:rgba(100,70,0,.55);box-shadow:0 0 16px rgba(100,70,0,.1);}
body.light .mb-fire-badge{background:linear-gradient(135deg,#7a5500,#a07020);color:#fff;}
body.light .mb-team-spark-lbl{color:rgba(60,40,0,.5);}
body.light .mb-spark-lbl{color:rgba(60,40,0,.5);}
body.light .mb-metric-lbl{color:rgba(60,40,0,.5);}
body.light .mb-tc-lbl{color:rgba(60,40,0,.5);}
body.light .mb-tc-sub{color:#4a3510;}
body.light .mb-metric-sub{color:#4a3510;}
body.light .mb-prog-lbl{color:#4a3510;}
body.light .mb-row-rep{filter:brightness(.7);}
body.light .mb-team-spark svg polyline{stroke:#7a5500 !important;}
body.light .mb-team-spark svg circle{fill:#7a5500 !important;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:'Segoe UI',system-ui,sans-serif;}

/* ── GATE ─────────────────────────────────────── */
#gate{position:fixed;inset:0;z-index:9000;display:flex;align-items:stretch;background:#0b0d14;}
.gate-left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(150deg,#0e101a 0%,#080a12 60%,#0b0d14 100%);position:relative;overflow:hidden;}
.gate-left-bg{position:absolute;inset:0;pointer-events:none;}
/* animated orange orb */
.gate-orb{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,100,30,.18) 0%,rgba(255,100,30,.06) 45%,transparent 70%);animation:orbPulse 4s ease-in-out infinite;top:50%;left:50%;transform:translate(-50%,-50%);}
@keyframes orbPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.8}50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}}
/* grid lines */
.gate-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,100,30,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,100,30,.04) 1px,transparent 1px);background-size:48px 48px;}
.gate-brand{display:flex;flex-direction:column;align-items:center;gap:20px;z-index:1;}
.gate-brand-logo{width:220px;filter:brightness(0) invert(1);}
.gate-brand-divider{width:48px;height:2px;background:linear-gradient(90deg,transparent,#ff6a1e,transparent);border-radius:2px;}
.gate-brand-tagline{font-size:.78rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.3);}
.gate-brand-pill{display:flex;align-items:center;gap:8px;background:rgba(255,106,30,.1);border:1px solid rgba(255,106,30,.25);border-radius:30px;padding:6px 18px;margin-top:8px;}
.gate-brand-pill-dot{width:7px;height:7px;border-radius:50%;background:#ff6a1e;box-shadow:0 0 8px #ff6a1e;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.gate-brand-pill span{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);}
/* right panel */
.gate-right{width:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 44px;background:#0d0f18;border-left:1px solid rgba(255,106,30,.1);position:relative;}
.gate-right::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#ff6a1e,transparent);}
.gate-panel-icon{width:52px;height:52px;border-radius:14px;background:rgba(255,106,30,.1);border:1px solid rgba(255,106,30,.2);display:flex;align-items:center;justify-content:center;margin-bottom:24px;}
.gate-panel-icon svg{width:24px;height:24px;}
.gate-title{font-size:1.25rem;font-weight:800;letter-spacing:.04em;color:#fff;margin-bottom:6px;text-align:center;}
.gate-sub{font-size:.75rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:40px;text-align:center;}
.gate-input-wrap{width:100%;margin-bottom:14px;position:relative;}
.gate-input-wrap input{width:100%;padding:15px 20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:1.1rem;font-weight:700;letter-spacing:.3em;text-align:center;color:#fff;outline:none;transition:border-color .2s,background .2s;}
.gate-input-wrap input:focus{border-color:rgba(255,106,30,.6);background:rgba(255,106,30,.05);}
.gate-input-wrap input::placeholder{letter-spacing:.1em;color:rgba(255,255,255,.2);font-weight:400;font-size:.85rem;}
#gateBtn{width:100%;padding:15px;background:linear-gradient(135deg,#ff6a1e,#e04a00);border:none;border-radius:10px;font-size:.9rem;font-weight:900;letter-spacing:.2em;color:#fff;cursor:pointer;transition:opacity .2s,transform .1s;text-transform:uppercase;}
#gateBtn:hover{opacity:.9;}
#gateBtn:active{transform:scale(.98);}
#gateErr{color:#ff5252;font-size:.8rem;margin-top:12px;height:20px;text-align:center;}
.gate-footer{position:absolute;bottom:24px;font-size:.68rem;color:rgba(255,255,255,.15);letter-spacing:.1em;text-transform:uppercase;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── APP ──────────────────────────────────────── */
#app{display:none;flex-direction:column;width:100vw;height:100vh;}

/* ── TICKER ───────────────────────────────────── */
#ticker{height:54px;background:rgba(0,0,0,.6);border-bottom:1px solid var(--border);display:flex;align-items:center;flex-shrink:0;overflow:hidden;}
.ticker-label{padding:0 16px;font-size:.82rem;font-weight:800;letter-spacing:.18em;color:var(--orange);white-space:nowrap;border-right:1px solid var(--border);}
.ticker-scroll{flex:1;overflow:hidden;position:relative;}
.ticker-inner{display:flex;gap:60px;white-space:nowrap;width:max-content;animation:tick 110s linear infinite;}
.ticker-inner:hover{animation-play-state:paused;}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{font-size:1.05rem;font-weight:600;letter-spacing:.03em;color:var(--cream2);}
.ticker-item strong{color:var(--cream);}
.ti-up{color:var(--up);}.ti-dn{color:var(--dn);}

/* ── SLIDESHOW ────────────────────────────────── */
#slideshow{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .55s ease,transform .55s ease;}
.slide.active{opacity:1;transform:translateY(0);pointer-events:all;}
.slide.exit{opacity:0;transform:translateY(-16px);}

/* ── SLIDE HEADER ─────────────────────────────── */
.slide-hdr{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--border);flex-shrink:0;}
.slide-hdr-left{display:flex;align-items:center;gap:14px;}
.slide-title{font-size:1.05rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--cream2);}
.slide-badge{background:var(--glass);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:.8rem;font-weight:700;letter-spacing:.1em;color:var(--gold);}
.slide-hdr-right{display:flex;gap:20px;font-size:.85rem;color:var(--cream2);}
.slide-hdr-right span{display:flex;align-items:center;gap:5px;}
.slide-hdr-right strong{color:var(--cream);}

/* ── SLIDE BODY ───────────────────────────────── */
.slide-body{flex:1;display:flex;overflow:hidden;}

/* ── OVERVIEW SLIDE ───────────────────────────── */
.ov-wrap{flex:1;display:flex;flex-direction:column;padding:24px 40px 110px;gap:14px;}
.ov-kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
.ov-kpi{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:18px 16px;text-align:center;}
.ov-kpi-lbl{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cream2);margin-bottom:8px;}
.ov-kpi-val{font-size:1.6rem;font-weight:900;color:var(--cream);}
.ov-kpi-val.gold{color:var(--gold);}
.ov-kpi-chg{font-size:.9rem;margin-top:6px;}
.ov-kpi-chg.up{color:var(--up);}.ov-kpi-chg.dn{color:var(--dn);}
.ov-reps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.ov-rep{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:10px;}
.ov-rep-name{font-size:1rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
.ov-rep-rev{font-size:1.8rem;font-weight:900;}
.ov-rep-stats{display:flex;gap:12px;font-size:.88rem;color:var(--cream2);}
.ov-rep-stats span{display:flex;flex-direction:column;gap:2px;}
.ov-rep-stats strong{color:var(--cream);font-size:1rem;}
.ov-bar-bg{background:rgba(255,255,255,.07);border-radius:4px;height:6px;width:100%;}
.ov-bar-fill{height:100%;border-radius:4px;transition:width 1s ease;}
.ov-share{font-size:.82rem;color:var(--cream2);margin-top:2px;}

/* ── MOMENTUM BOARD ───────────────────────────── */
.mb-wrap{flex:1;display:flex;flex-direction:column;padding:12px 32px 110px;gap:10px;min-height:0;}
/* Team pulse strip */
.mb-team-strip{background:var(--glass);border:1px solid rgba(201,162,39,.4);border-radius:12px;display:grid;grid-template-columns:180px 1fr 1fr 1fr 1.6fr;overflow:hidden;flex-shrink:0;}
.mb-team-spark{display:flex;flex-direction:column;justify-content:center;padding:8px 16px;gap:6px;border-left:1px solid var(--border);}
.mb-team-spark-lbl{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(200,180,130,.4);}
.mb-team-spark-svg{width:100%;height:40px;display:block;}
.mb-team-lbl{display:flex;align-items:center;justify-content:center;padding:12px 18px;font-size:1.05rem;font-weight:900;color:var(--gold);letter-spacing:.08em;border-right:1px solid var(--border);}
.mb-team-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 10px;gap:2px;border-right:1px solid var(--border);}
.mb-team-cell:last-child{border-right:none;}
.mb-tc-lbl{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(200,180,130,.45);}
.mb-tc-val{font-size:1.55rem;font-weight:900;color:var(--gold);}
.mb-tc-chg{font-size:.88rem;font-weight:700;}
.mb-tc-chg.up{color:var(--up);}.mb-tc-chg.dn{color:var(--dn);}
.mb-tc-sub{font-size:.82rem;color:var(--cream2);}
/* Rep rows */
.mb-rows{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;}
.mb-row{flex:1;min-height:0;background:var(--glass);border:1px solid var(--border);border-radius:12px;display:grid;grid-template-columns:200px 1fr 1fr 1fr 1.6fr;overflow:hidden;transition:border-color .3s;}
.mb-row.on-fire{border-color:rgba(201,162,39,.65);box-shadow:0 0 16px rgba(201,162,39,.12);}
/* Name cell */
.mb-row-name{display:flex;flex-direction:column;justify-content:center;padding:0 18px;gap:6px;border-right:1px solid var(--border);}
.mb-row-rep{font-size:1.1rem;font-weight:900;}
.mb-fire-badge{font-size:.68rem;font-weight:800;letter-spacing:.06em;background:linear-gradient(135deg,#c9a227,#e8c84a);color:#09090d;padding:3px 9px;border-radius:20px;align-self:flex-start;}
/* Metric cells */
.mb-metric{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;gap:4px;border-right:1px solid var(--border);}
.mb-metric:last-of-type{border-right:1px solid var(--border);}
.mb-metric-lbl{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(200,180,130,.45);text-align:center;}
.mb-metric-val{font-size:1.5rem;font-weight:900;}
.mb-metric-chg{font-size:.85rem;font-weight:700;}
.mb-metric-chg.up{color:var(--up);}.mb-metric-chg.dn{color:var(--dn);}
.mb-metric-sub{font-size:.82rem;color:var(--cream2);text-align:center;}
/* Spark + progress cell */
.mb-spark-cell{display:flex;flex-direction:column;justify-content:center;padding:10px 18px;gap:8px;border-left:none;}
.mb-spark-lbl{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(200,180,130,.4);}
.mb-spark-svg{width:100%;flex:1;min-height:0;display:block;}
.mb-prog-wrap{display:flex;flex-direction:column;gap:4px;}
.mb-prog-lbl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--cream2);}
.mb-prog-track{height:7px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;}
.mb-prog-fill{height:100%;border-radius:4px;}

/* ── LEADERBOARD ──────────────────────────────── */
.lb-wrap{flex:1;display:flex;flex-direction:column;padding:20px 40px;gap:10px;}
.lb-row{display:grid;grid-template-columns:52px 1fr 110px 110px 1fr 160px 110px;gap:0;align-items:center;}
.lb-row.header{background:transparent!important;border:none!important;}
.lb-row.header .lb-cell{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(200,180,130,.4);padding:8px 14px;}
.lb-row:not(.header){background:var(--glass);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:background .2s;}
.lb-row:not(.header):hover{background:rgba(201,162,39,.07);}
.lb-cell{padding:14px 14px;}
.lb-rank{font-size:1.6rem;text-align:center;}
.lb-name{display:flex;flex-direction:column;gap:3px;}
.lb-name-main{font-size:1rem;font-weight:800;}
.lb-name-sub{font-size:.8rem;color:var(--cream2);}
.lb-wow,.lb-avg,.lb-rev,.lb-ord{font-size:1rem;font-weight:700;text-align:right;}
.lb-bar-cell{padding:14px 14px;}
.lb-bar-bg{background:rgba(255,255,255,.07);border-radius:4px;height:8px;}
.lb-bar-fill{height:100%;border-radius:4px;transition:width 1s ease;}
.lb-rev{font-size:1.15rem;font-weight:900;}

/* ── REP SPOTLIGHT ────────────────────────────── */
.theme-0{--ac:var(--c0);--ac2:#a07c10;}
.theme-1{--ac:var(--c1);--ac2:#1f6fa0;}
.theme-2{--ac:var(--c2);--ac2:#1a8a45;}
.theme-3{--ac:var(--c3);--ac2:#8a4e1a;}
.rep-body{flex:1;display:flex;flex-direction:column;padding:0 32px 110px;gap:10px;}
/* Name + 4 stat boxes row */
.rep-name-bar{display:flex;align-items:center;gap:20px;padding:10px 0 12px;border-bottom:1px solid var(--border);}
.rep-name-left{display:flex;align-items:center;gap:12px;flex:1;}
.rep-rank-badge{font-size:2.2rem;line-height:1;}
.rep-hero-name{font-size:2rem;font-weight:900;color:var(--ac);line-height:1;}
.rep-name-stats{display:flex;gap:10px;flex-shrink:0;}
.rep-ns-box{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:10px 18px;display:flex;flex-direction:column;gap:3px;min-width:110px;text-align:right;}
.rep-ns-lbl{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cream2);}
.rep-ns-val{font-size:1.45rem;font-weight:900;color:var(--cream);line-height:1;}
.rep-ns-val.gold{color:var(--ac);}
/* Main 2-col layout */
.rep-main{flex:1;display:grid;grid-template-columns:1.55fr 1fr;gap:16px;min-height:0;}
/* Chart column */
.rep-chart-col{display:flex;flex-direction:column;justify-content:flex-start;gap:6px;flex:1;padding-bottom:28px;}
.rep-spark-title{font-size:.82rem;letter-spacing:.15em;text-transform:uppercase;color:var(--cream2);}
.spark-svg{width:100%;}
.spark-xlabels{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600;color:var(--cream2);padding:0 2px;margin-top:2px;}
/* Right column */
.rep-right-col{display:flex;flex-direction:column;gap:0;min-height:0;overflow:hidden;height:100%;}
.rep-prod-section{flex:1;display:flex;flex-direction:column;min-height:0;}
.rep-prod-list{flex:1;display:flex;flex-direction:column;min-height:0;}
.rep-prod-row{flex:1;}
.rep-health-section{flex:1;display:flex;flex-direction:column;min-height:0;}
.rep-health-list{flex:1;display:flex;flex-direction:column;min-height:0;}
.rep-health-row{flex:1;}
/* Top products */
.rep-prod-title{font-size:.82rem;letter-spacing:.15em;text-transform:uppercase;color:var(--cream2);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.rep-prod-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.rep-prod-rank{font-size:.88rem;color:var(--cream2);width:20px;flex-shrink:0;}
.rep-prod-name{flex:1;font-size:1rem;font-weight:600;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rep-prod-rev{font-size:1.05rem;font-weight:900;color:var(--ac);white-space:nowrap;}
/* Account health */
.rep-health-title{font-size:.82rem;letter-spacing:.15em;text-transform:uppercase;color:var(--cream2);padding:12px 0 8px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.rep-health-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.rep-health-lbl{font-size:.92rem;color:var(--cream2);}
.rep-health-val{font-size:1.05rem;font-weight:700;color:var(--cream);}
.rep-health-val.gold{color:var(--ac);}
.rep-health-val.up{color:var(--up);}
.rep-health-val.dn{color:var(--dn);}
/* 3-card KPI row */
.rep-kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;flex-shrink:0;}
.rep-kpi-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:14px;padding:14px 20px;position:relative;overflow:hidden;}
.rep-kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac);}
.rep-kpi-lbl{font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cream2);margin-bottom:6px;}
.rep-kpi-val{font-size:2.1rem;font-weight:900;line-height:1;margin-bottom:5px;color:var(--cream);}
.rep-kpi-chg{font-size:.92rem;font-weight:700;}
.rep-kpi-chg.up{color:var(--up);}.rep-kpi-chg.dn{color:var(--dn);}
.rep-kpi-sub{font-size:.82rem;color:var(--cream2);margin-top:4px;}
/* legacy hidden */
.rep-details-row{display:none;}
.rep-hero{display:none;}
.rep-drugs{display:none;}
.rep-meta{display:none;}

/* ── WEEKLY TREND ─────────────────────────────── */
.chart-wrap{flex:1;padding:16px 40px;display:flex;flex-direction:column;gap:10px;}
.chart-legend{display:flex;gap:20px;flex-wrap:wrap;}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--cream2);}
.chart-legend-dot{width:10px;height:10px;border-radius:50%;}
.chart-svg{flex:1;width:100%;min-height:0;}

/* ── MoM ──────────────────────────────────────── */
.mom-wrap{flex:1;padding:12px 32px 14px;display:flex;flex-direction:column;gap:12px;min-height:0;}
.mom-rep-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex-shrink:0;}
.mom-rep-card{background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.mom-rep-name{font-size:.95rem;font-weight:900;padding-bottom:6px;border-bottom:1px solid var(--border);}
.mom-rep-cols{display:flex;gap:0;}

const fmt  = v => '$' + (v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':v.toFixed(0));
const fmtFull = v => '$' + v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
const pct  = (a,b) => b>0?((a-b)/b*100).toFixed(1):null;
const arrow = (v,cls='') => {
  const n=parseFloat(v);
  if(v===null||isNaN(n)) return '<span style="color:#666">—</span>';
  return n>=0?`<span class="ti-up">▲ ${Math.abs(v)}%</span>`:`<span class="ti-dn">▼ ${Math.abs(v)}%</span>`;
};
const chgBadge = (cur,prev) => {
  if(!prev) return '';
  const p = pct(cur,prev);
  const cls = parseFloat(p)>=0?'up':'dn';
  return `<div class="rep-kpi-chg ${cls}">${parseFloat(p)>=0?'▲':'▼'} ${Math.abs(p)}% vs prior period</div>`;
};

// ── COMPOSITE REP RANKING ──────────────────────────────────────────
(function(){
  const curMo = DATA.generated.slice(0,7);
  reps.forEach(r => {
    const mRow = momData.reps.find(x=>x.rep===r.name)||{cur:0,prev:1};
    r._mom_rev  = mRow.cur  || 0;
    r._mom_pct  = mRow.prev > 0 ? (mRow.cur - mRow.prev) / mRow.prev * 100 : 0;
    r._new_mo   = newAccounts30d.filter(a=>a.rep===r.name && a.date && a.date.slice(0,7)===curMo).length;
    r._scores   = 0;
  });
  const rankOn = fn => {
    [...reps].sort((a,b)=>fn(b)-fn(a)).forEach((r,i)=>{ r._scores += (4-i); });
  };
  rankOn(r => r._mom_rev);
  rankOn(r => r.orders_mo   || 0);
  rankOn(r => r.clinics      || 0);
  rankOn(r => r.avg_order_mo || 0);
  rankOn(r => r._new_mo);
  rankOn(r => r._mom_pct);
  reps.forEach(r => {
    if(r._new_mo  >= 8) r._scores += 2;
    if(r._mom_pct >  0) r._scores += 1;
  });
  reps.sort((a,b) => b._scores - a._scores);
  const medals = ['🥇','🥈','🥉','4'];
  reps.forEach((r,i) => { r.rank = medals[i] || String(i+1); });
})();

function buildTicker(){
  const sep = '<span class="ticker-item" style="color:rgba(200,170,100,.22);font-size:.9rem">◆</span>';
  const todayTot = daily[daily.length-1].tot;
  const ydayTot  = daily[daily.length-2].tot;
  const dodPct   = pct(todayTot,ydayTot);
  const wowPct   = pct(wowData.cur,wowData.prev);
  const momPct   = pct(momData.cur,momData.prev);
  const teamItems = [
    `<span class="ticker-item"><strong>TEAM TODAY</strong> &nbsp;${fmt(todayTot)} &nbsp;${arrow(dodPct)} vs yesterday</span>`,
    `<span class="ticker-item"><strong>THIS WEEK</strong> &nbsp;${fmt(wowData.cur)} &nbsp;${arrow(wowPct)} vs last wk</span>`,
    `<span class="ticker-item"><strong>THIS MONTH</strong> &nbsp;${fmt(momData.cur)} &nbsp;${arrow(momPct)} vs prior period</span>`,
  ];
  const clinicItems = topClinics.slice(0,8).map(c=>
    `<span class="ticker-item"><strong>${c.name}</strong> &nbsp;<span style="color:#666">${c.state}</span>&nbsp; ${fmt(c.revenue)} &nbsp;·&nbsp; ${c.rx} Orders &nbsp;·&nbsp; <span style="color:#666">${c.rep.split(' ')[0]}</span></span>`
  );
  const newItems = newAccounts7d.map(a=>
    `<span class="ticker-item" style="color:#3dba6d"><strong>★ NEW</strong> &nbsp;${a.clinic} &nbsp;<span style="color:#666">${a.state} · ${a.rep.split(' ')[0]}</span></span>`
  );
  const drugItems = reps.map(r=>{
    const d = r.topDrugs&&r.topDrugs[0];
    if(!d) return '';
    return `<span class="ticker-item"><strong>${r.short}</strong> &nbsp;top Rx: ${d.name} &nbsp;${fmt(d.rev)}</span>`;
  }).filter(Boolean);
  const all = [...teamItems,sep,...clinicItems,sep,...newItems,sep,...drugItems,sep];
  const SP = '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
  const half = all.join(SP);
  document.getElementById('tickerInner').innerHTML = half+SP+half;
}

    countUp();
    buildProgressBars();
  }, 80);
}

// ── SLIDE 2: MOMENTUM BOARD ────────────────────────────────────────
function slideMomentum(){
  const todayTot = daily[daily.length-1].tot;
  const ydayTot  = daily[daily.length-2].tot;
  const dodPct   = pct(todayTot, ydayTot);
  const wowPct   = pct(wowData.cur, wowData.prev);
  // Full prior month totals
  const prevFullMo    = (DATA.monthly && DATA.monthly.length >= 2) ? DATA.monthly[DATA.monthly.length-2].tot : momData.prev;
  const prevFullMoLbl = (DATA.monthly && DATA.monthly.length >= 2) ? DATA.monthly[DATA.monthly.length-2].label : 'Prior';
  const curMoLbl      = (DATA.monthly && DATA.monthly.length >= 1)
    ? new Date(DATA.monthly[DATA.monthly.length-1].month+'-02').toLocaleString('en-US',{month:'short'}).toUpperCase()+' MTD'
    : 'MTD';
  const momPct = pct(momData.cur, prevFullMo);

  // ── Team pulse strip ──
  const tcCell = (lbl,val,chg,sub)=>`<div class="mb-team-cell">
    <div class="mb-tc-lbl">${lbl}</div>
    <div class="mb-tc-val">${val}</div>
    <div class="mb-tc-chg ${parseFloat(chg)>=0?'up':'dn'}">${parseFloat(chg)>=0?'▲':'▼'} ${Math.abs(chg)}%</div>
    <div class="mb-tc-sub">${sub}</div>
  </div>`;

  // Team 6-week sparkline (gold)
  const sparkWeeksEarly = DATA.spark_weeks || [];
  // spark_weeks has no 'tot' — sum all rep values per week
  const SPARK_REP_NAMES = REPS.map(r=>r.name);
  const teamSpark6 = sparkWeeksEarly.slice(-6).map(w=>
    SPARK_REP_NAMES.reduce((s,n)=>s+(w[n]||0), 0)
  );
  const teamSparkSVG = (()=>{
    const vals = teamSpark6, w=220, h=40, pad=4;
    const max = Math.max(...vals,1);
    const pts = vals.map((v,i)=>{
      const x=pad+(i/(vals.length-1))*(w-pad*2), y=h-pad-(v/max)*(h-pad*2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const area=`${pad},${h-pad} `+pts.join(' ')+` ${w-pad},${h-pad}`;
    const last=pts[pts.length-1];
    const sc = document.body.classList.contains('light') ? '#7a5500' : '#c9a227';
    return `<svg class="mb-team-spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs><linearGradient id="tsg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${sc}" stop-opacity=".4"/>
        <stop offset="100%" stop-color="${sc}" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon points="${area}" fill="url(#tsg)"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="${sc}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${last.split(',')[0]}" cy="${last.split(',')[1]}" r="3.5" fill="${sc}"/>
    </svg>`;
  })();

  const teamStrip = `<div class="mb-team-strip">
    <div class="mb-team-lbl">TEAM TOTAL</div>
    ${tcCell('TODAY', fmt(todayTot), dodPct, `vs ${fmt(ydayTot)} yesterday`)}
    ${tcCell('THIS WEEK', fmt(wowData.cur), wowPct, `vs ${fmt(wowData.prev)} last wk`)}
    ${tcCell(curMoLbl+' vs '+prevFullMoLbl, fmt(momData.cur), momPct, `vs ${fmt(prevFullMo)} full ${prevFullMoLbl}`)}
    <div class="mb-team-spark">
      <div class="mb-team-spark-lbl">6-Week Team Trend</div>
      ${teamSparkSVG}
    </div>
  </div>`;

  // ── Sparkline helper (6 weeks) ──
  const sparkSVG = (vals, color)=>{
    const w=220, h=44, pad=4;
    const max = Math.max(...vals,1);
    const pts = vals.map((v,i)=>{
      const x = pad + (i/(vals.length-1))*(w-pad*2);
      const y = h - pad - (v/max)*(h-pad*2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    // Area fill
    const first = vals.map((v,i)=>{
      const x = pad+(i/(vals.length-1))*(w-pad*2);
      const y = h-pad-(v/max)*(h-pad*2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const area = `${pad},${h-pad} `+first.join(' ')+` ${w-pad},${h-pad}`;
    return `<svg class="mb-spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs><linearGradient id="sg_${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".35"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon points="${area}" fill="url(#sg_${color.replace('#','')})" />
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${first[first.length-1].split(',')[0]}" cy="${first[first.length-1].split(',')[1]}" r="3.5" fill="${color}"/>
    </svg>`;
  };

  // ── Rep rows ──
  const last6 = sparkWeeksEarly.slice(-6);

  const rows = reps.map(r=>{
    const dRow = repDod.find(d=>d.rep===r.name)||{today:0,yday:0};
    const wRow = wowData.reps.find(x=>x.rep===r.name)||{cur:0,prev:1};
    const mRow = momData.reps.find(x=>x.rep===r.name)||{cur:0,prev:1};
    const repPrevFullMo = (DATA.monthly && DATA.monthly.length >= 2)
      ? (DATA.monthly[DATA.monthly.length-2][r.name] || 0) : (mRow.prev || 0);

    const dp = pct(dRow.today, dRow.yday)||'0.0';
    const wp = pct(wRow.cur,   wRow.prev)||'0.0';
    const mp = pct(mRow.cur,   repPrevFullMo)||'0.0';

    const onFire = parseFloat(dp) > 0 && parseFloat(wp) > 0;

    const progRaw = repPrevFullMo > 0 ? (mRow.cur / repPrevFullMo) * 100 : 0;
    const progPct = Math.min(progRaw, 100);
    const progLabel = repPrevFullMo > 0 ? `${progRaw.toFixed(0)}% of ${prevFullMoLbl} (${fmt(repPrevFullMo)})` : '';

    const sparkVals = last6.map(w=>w[r.name]||0);

    const metric = (lbl,val,chg,sub)=>`<div class="mb-metric">
      <div class="mb-metric-lbl">${lbl}</div>
      <div class="mb-metric-val">${val}</div>
      <div class="mb-metric-chg ${parseFloat(chg)>=0?'up':'dn'}">${parseFloat(chg)>=0?'▲':'▼'} ${Math.abs(chg)}%</div>
      <div class="mb-metric-sub">${sub}</div>
    </div>`;

    return `<div class="mb-row${onFire?' on-fire':''}">
      <div class="mb-row-name">
        <div class="mb-row-rep" style="color:${r.col}">${r.rank} ${r.name.split(' ')[0]} ${r.name.split(' ').slice(-1)[0]}</div>
        ${onFire?'<div class="mb-fire-badge">🔥 ON FIRE</div>':''}
      </div>
      ${metric('Today', fmt(dRow.today), dp, `vs ${fmt(dRow.yday)} yesterday`)}
      ${metric('This Week', fmt(wRow.cur), wp, `vs ${fmt(wRow.prev)} last wk`)}
      ${metric(curMoLbl+' vs '+prevFullMoLbl, fmt(mRow.cur), mp, `vs ${fmt(repPrevFullMo)} full ${prevFullMoLbl}`)}
      <div class="mb-spark-cell">
        <div class="mb-spark-lbl">6-Week Trend</div>
        ${sparkSVG(sparkVals, r.col)}
        <div class="mb-prog-wrap">
          <div class="mb-prog-lbl">
            <span>MTD Pace</span>
            <span style="color:${r.col};font-weight:700">${progLabel}</span>
          </div>
          <div class="mb-prog-track">
            <div class="mb-prog-fill" style="width:${progPct.toFixed(1)}%;background:${r.col}"></div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  return `<div class="slide" id="slide-1">
    <div class="slide-hdr">
      <div class="slide-hdr-left">
        <div class="slide-title">Momentum Board</div>
        <div class="slide-badge">DoD · WoW · MoM</div>
      </div>
      <div class="slide-hdr-right"></div>
    </div>
    <div class="slide-body">
      <div class="mb-wrap">
        ${teamStrip}
        <div class="mb-rows">${rows}</div>
      </div>
    </div>
  </div>`;
}

function slideRep(r, idx){
  const slideIdx = 3 + idx;

  const mRow  = momData.reps.find(x=>x.rep===r.name)||{cur:0,prev:1};
  // Use full prior month from monthly array (same fix as Slide 1 team total)
  const repPrevFullMo = (DATA.monthly && DATA.monthly.length >= 2)
    ? (DATA.monthly[DATA.monthly.length-2][r.name] || 0)
    : (mRow.prev || 0);
  const dPct  = pct(dRow.today||0, dRow.yday||1);
  const wPct  = pct(wRow.cur||0,   wRow.prev||1);
  const mPct  = pct(mRow.cur||0,   repPrevFullMo||1);
  const moLabel = new Date(DATA.generated+"T12:00:00").toLocaleString("en-US",{month:"short"}).toUpperCase();

  // Spark data — all 13 weeks from spark_weeks
  const sparkWeeks = DATA.spark_weeks; // exactly 13 entries
  const sparkVals  = sparkWeeks.map(w=>w[r.name]||0);
  const sparkMax   = Math.max(...sparkVals, 1);

  // SVG dimensions — no left gutter (Y labels are HTML, not SVG text)
  const svgW = 400, svgH = 100;
  const padT = 4, padB = 4;
  const chartH = svgH - padT - padB;
  const nBars  = sparkWeeks.length; // 13
  const bW     = svgW / nBars;

  // Y-axis nice ticks
  const niceMax = (v => {
    if(v<=0) return 1000;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.ceil(v/mag)*mag;
  })(sparkMax);
  const yTicks = [0, niceMax/3, (niceMax*2)/3, niceMax];
  const fmtY = v => {
    if(v===0) return '$0';
    if(v>=1000) return '$'+(v/1000).toFixed(0)+'k';
    return '$'+Math.round(v);
  };

  // Gridlines only (no text — labels rendered as HTML)
  const gridLines = yTicks.map(tick=>{
    const y = padT + chartH - (tick/niceMax)*chartH;
    return `<line x1="0" y1="${y.toFixed(1)}" x2="${svgW}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.08)" stroke-width="1"/>`;
  }).join('');

  const sparkBars = sparkVals.map((v,i)=>{
    const h  = (v/niceMax)*chartH;
    const x  = i*bW + bW*0.1;
    const w  = bW*0.8;
    const y  = padT + chartH - h;
    const op = v>0 ? 0.85 : 0.15;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,1.5).toFixed(1)}" fill="var(--ac)" opacity="${op}" rx="2"/>`;
  }).join('');

  // HTML Y-axis labels (positioned as % from bottom)
  const yAxisHTML = yTicks.map(tick=>{
    const btm = (tick/niceMax)*100;
    return `<div style="position:absolute;left:0;bottom:calc(${btm.toFixed(1)}%);font-size:.82rem;font-weight:600;color:rgba(200,180,130,.75);white-space:nowrap;transform:translateY(50%);max-width:42px;overflow:hidden;text-overflow:ellipsis;">${fmtY(tick)}</div>`;
  }).join('');

  // X-axis labels
  const xLabels = [sparkWeeks[0]?.week||'', sparkWeeks[6]?.week||'', sparkWeeks[12]?.week||''];

  // Top drugs — use rolling 30-day, fall back to YTD if missing
  const drugs = (r.topDrugs30d||r.topDrugs||[]).slice(0,5);

  // New accounts this month for this rep
  const moNew = newAccounts30d.filter(a=>a.rep===r.name&&a.date&&a.date.slice(0,7)===DATA.generated.slice(0,7)).length;
  const goal  = 8;
  const pipColor = moNew>=goal?'var(--up)':moNew>=5?'var(--ac)':'var(--cream)';
  const goalMet = moNew >= goal;
  const pips = Array.from({length:goal},(_,i)=>
    i<moNew
      ? `<span style="width:13px;height:13px;border-radius:50%;background:#27ae60;display:inline-block;box-shadow:0 0 7px rgba(39,174,96,.6);"></span>`
      : goalMet
        ? `<span style="width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(39,174,96,.4);background:rgba(39,174,96,.08);display:inline-block;"></span>`
        : `<span style="width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,82,82,.45);background:rgba(255,82,82,.10);display:inline-block;"></span>`
  ).join('');

  // Account health values
  const retCls  = (r.retention_pct||0)>=70?'up':'dn';
  const newCls  = moNew>0?'up':'';

  return `<div class="slide theme-${r.theme}" id="slide-${slideIdx}">
    <div class="slide-hdr">
      <div class="slide-hdr-left">
        <div class="slide-badge" style="font-size:.78rem;padding:5px 14px;">Rep Spotlight</div>
      </div>
      <div class="slide-hdr-right">
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;">
          <div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cream2);">New Accounts · ${moLabel} Goal</div>
          <div style="display:flex;align-items:center;gap:9px;">
            <div style="display:flex;gap:4px;align-items:center;">${pips}</div>
            <span style="font-size:1.35rem;font-weight:900;color:${pipColor};">${moNew}<span style="font-size:.82em;font-weight:400;color:var(--cream2);"> / 8</span></span>
          </div>
        </div>
      </div>
    </div>
    <div class="slide-body">
      <div class="rep-body">

        <!-- Rep name + 4 stat boxes -->
        <div class="rep-name-bar">
          <div class="rep-name-left">
            <span class="rep-rank-badge">${r.rank}</span>
            <div class="rep-hero-name">${r.name}</div>
          </div>
          <div class="rep-name-stats">
            <div class="rep-ns-box">
              <div class="rep-ns-lbl">This Month</div>
              <div class="rep-ns-val gold">${fmtFull(mRow.cur||0)}</div>
            </div>
            <div class="rep-ns-box">
              <div class="rep-ns-lbl">Orders ${moLabel}</div>
              <div class="rep-ns-val">${(r.orders_mo||0).toLocaleString()}</div>
            </div>
            <div class="rep-ns-box">
              <div class="rep-ns-lbl">Clinics ${moLabel}</div>
              <div class="rep-ns-val">${r.clinics||0}</div>
            </div>
            <div class="rep-ns-box">
              <div class="rep-ns-lbl">Avg Order ${moLabel}</div>
              <div class="rep-ns-val">$${Math.round(r.avg_order_mo||0).toLocaleString()}</div>
            </div>
          </div>
        </div>

        <!-- 3 KPI cards -->
        <div class="rep-kpi-row">
          <div class="rep-kpi-card">
            <div class="rep-kpi-lbl">📅 Today vs Yesterday</div>
            <div class="rep-kpi-val" data-cu="${dRow.today||0}" data-cu-prefix="$" data-cu-flash>${fmt(dRow.today||0)}</div>
            <div class="rep-kpi-chg ${parseFloat(dPct)>=0?'up':'dn'}">${parseFloat(dPct)>=0?'▲':'▼'} ${Math.abs(dPct)}% vs prior period</div>
            <div class="rep-kpi-sub">Yesterday: ${fmt(dRow.yday||0)}</div>
          </div>
          <div class="rep-kpi-card">
            <div class="rep-kpi-lbl">📈 This Week vs Last</div>
            <div class="rep-kpi-val" data-cu="${wRow.cur||0}" data-cu-prefix="$" data-cu-flash>${fmt(wRow.cur||0)}</div>
            <div class="rep-kpi-chg ${parseFloat(wPct)>=0?'up':'dn'}">${parseFloat(wPct)>=0?'▲':'▼'} ${Math.abs(wPct)}% vs prior period</div>
            <div class="rep-kpi-sub">Last week: ${fmt(wRow.prev||0)}</div>
          </div>
          <div class="rep-kpi-card">
            <div class="rep-kpi-lbl">📊 This Month vs Prior</div>
            <div class="rep-kpi-val" data-cu="${mRow.cur||0}" data-cu-prefix="$" data-cu-flash>${fmt(mRow.cur||0)}</div>
            <div class="rep-kpi-chg ${parseFloat(mPct)>=0?'up':'dn'}">${parseFloat(mPct)>=0?'▲':'▼'} ${Math.abs(mPct)}% vs prior period</div>
            <div class="rep-kpi-sub">Prior period: ${fmt(repPrevFullMo||0)}</div>
          </div>
        </div>

        <!-- Main 2-column body -->
        <div class="rep-main">

          <!-- LEFT: Chart -->
          <div class="rep-chart-col">
            <div class="rep-spark-title">13-Week Revenue</div>
            <div style="flex:1;display:flex;flex-direction:column;min-height:0;padding-top:14px;gap:4px;">
              <!-- SVG row: Y-axis + chart side by side -->
              <div style="flex:1;display:flex;gap:6px;min-height:0;">
                <!-- Y-axis label column — same height as SVG only -->
                <div style="position:relative;width:44px;flex-shrink:0;">${yAxisHTML}</div>
                <svg style="flex:1;width:100%;display:block;" viewBox="0 0 ${svgW} ${svgH}" preserveAspectRatio="none">${gridLines}${sparkBars}</svg>
              </div>
              <!-- X-axis labels below SVG, indented to align with chart -->

              <div class="rep-health-list">

// ── SLIDE 8: WEEKLY TREND ──────────────────────────────────────────
function slideWeeklyTrend(){ return slideAtRisk(); }
function slideAtRisk(){
  const atRisk = DATA.at_risk || [];
  const totalRev = atRisk.reduce((s,r)=>s+r.prior_rev,0);
  const critical = atRisk.filter(r=>r.days_silent>=45).length;
  const warning  = atRisk.filter(r=>r.days_silent>=30&&r.days_silent<45).length;

  const rows = atRisk.length === 0
    ? `<div style="text-align:center;padding:60px 0;color:var(--cream2);font-size:1.3rem;">✅ No clinics at risk — great retention!</div>`
    : atRisk.map((r,i)=>{
    const rep = REPS.find(x=>x.short===r.rep||x.name===r.rep)||{col:'var(--cream2)'};
    const cls = r.days_silent>=45 ? 'critical' : 'warning';
    const dayCol = r.days_silent>=45 ? 'rgba(255,80,80,.9)' : 'rgba(255,140,58,.9)';
    const lastDate = r.last_order ? new Date(r.last_order+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '—';
    return `<div class="risk-row ${cls}">
      <div class="risk-rank">${i+1}</div>
      <div class="risk-name" title="${r.name}">${r.name}</div>
      <div class="risk-rep" style="color:${rep.col}">${r.rep}</div>
      <div class="risk-rev">$${Math.round(r.prior_rev).toLocaleString()}</div>
      <div class="risk-days" style="color:${dayCol}">${r.days_silent}d</div>
      <div class="risk-last">${lastDate}</div>
    </div>`;
  }).join('');

  return `<div class="slide" id="slide-7">
    <div class="slide-hdr">
      <div class="slide-hdr-left">
        <div class="slide-title">⚠️ Clinics at Risk</div>
        <div class="slide-badge">30-Day Lapse</div>
      </div>
      <div class="slide-hdr-right">
        <span>At Risk: <strong style="color:rgba(255,100,80,.9)">${atRisk.length}</strong></span>
        <span>Revenue Exposure: <strong style="color:rgba(255,140,58,.9)">$${Math.round(totalRev).toLocaleString()}</strong></span>
      </div>
    </div>
    <div class="slide-body" style="overflow:hidden;">
      <div class="risk-wrap">
        <div class="risk-summary">
          <div class="risk-stat">
            <div class="risk-stat-lbl">Critical <span style="font-size:.8em;color:rgba(255,80,80,.7);">45+ days</span></div>
            <div class="risk-stat-val" style="color:rgba(255,80,80,.9)">${critical}</div>
          </div>
          <div class="risk-stat">
            <div class="risk-stat-lbl">Warning <span style="font-size:.8em;color:rgba(255,140,58,.7);">30–44 days</span></div>
            <div class="risk-stat-val" style="color:rgba(255,140,58,.9)">${warning}</div>
          </div>
          <div class="risk-stat" style="margin-left:auto;text-align:right;">
            <div class="risk-stat-lbl">Revenue at Risk (Prior 30d)</div>
            <div class="risk-stat-val" style="color:rgba(255,120,80,.85)">$${Math.round(totalRev).toLocaleString()}</div>
          </div>
        </div>
        <div class="risk-hdr">
          <div class="risk-hdr-cell">#</div>
          <div class="risk-hdr-cell">Clinic</div>
          <div class="risk-hdr-cell">Rep</div>
          <div class="risk-hdr-cell" style="text-align:right">Prior 30d Rev</div>
          <div class="risk-hdr-cell" style="text-align:right">Silent</div>
          <div class="risk-hdr-cell" style="text-align:right">Last Order</div>
        </div>
        <div class="risk-list">${rows}</div>
      </div>
    </div>
  </div>`;
}

// ── SLIDE 9: MoM ──────────────────────────────────────────────────
function slideMoM(){
  const months  = DATA.monthly;
  const last3   = months.slice(-3);   // [2mo ago, last full mo, current MTD]
  const bestMo  = months.reduce((a,b)=>b.tot>a.tot?b:a, months[0]);
  const curMTD  = last3[last3.length-1];
  const prevFull= last3[last3.length-2];
  const paceRaw = prevFull.tot>0 ? (curMTD.tot/prevFull.tot*100).toFixed(0) : 0;

  // ── Rep 3-month summary cards ──
  const repCards = REPS.map(r=>{
    const vals   = last3.map(m=>m[r.name]||0);
    const maxRep = Math.max(...vals,1);
    const cols   = last3.map((m,i)=>{
      const v=vals[i], isCur=i===2;
      const chg = i>0 && vals[i-1]>0 ? ((v-vals[i-1])/vals[i-1]*100) : null;
      return `<div class="mom-rep-col">
        <div class="mom-rc-lbl">${m.label}${isCur?' MTD':''}</div>
        <div class="mom-rc-val" style="color:${isCur?r.col:'var(--cream)'}">${fmt(v)}</div>
        ${chg!==null
          ?`<div class="mom-rc-chg ${chg>=0?'up':'dn'}">${chg>=0?'▲':'▼'} ${Math.abs(chg).toFixed(1)}%</div>`
          :'<div style="height:1rem"></div>'}
        <div class="mom-rc-bar"><div class="mom-rc-fill" style="width:${(v/maxRep*100).toFixed(1)}%;background:${r.col};${isCur?'opacity:.65':''}"></div></div>
      </div>`;
    }).join('<div class="mom-rc-div"></div>');
    return `<div class="mom-rep-card">
      <div class="mom-rep-name" style="color:${r.col}">${r.rank} ${r.short}</div>
      <div class="mom-rep-cols">${cols}</div>
    </div>`;
  }).join('');

  // ── Legend ──
  const legend = REPS.map(r=>`<div class="mom-legend-item">
    <div class="mom-legend-dot" style="background:${r.col}"></div>${r.short}
  </div>`).join('');

  return `<div class="slide" id="slide-8">
    <div class="slide-hdr">
      <div class="slide-hdr-left">
        <div class="slide-title">Monthly Revenue Trajectory</div>
        <div class="slide-badge">3-Month View</div>
      </div>
      <div class="slide-hdr-right">
        <span>Best Month: <strong>${fmt(bestMo.tot)} (${bestMo.label})</strong></span>
        <span>MTD Pace: <strong class="gold-text">${paceRaw}% of ${prevFull.label}</strong></span>
      </div>
    </div>
    <div class="slide-body">
      <div class="mom-wrap">
        <div class="mom-rep-strip">${repCards}</div>
        <div class="mom-chart-area">
          <svg id="momChart" class="mom-chart-svg" style="overflow:visible;"></svg>
          <div class="mom-legend">${legend}</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ── CHARTS ─────────────────────────────────────────────────────────
function drawWeeklyChart(){
  const svg = document.getElementById('weeklyChart');
  if(!svg) return;
  const W = svg.parentElement.clientWidth||900, H = svg.parentElement.clientHeight||220;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const weeks = DATA.weekly;
  const n = weeks.length;
  const maxV = Math.max(...weeks.map(w=>w.tot||0))||1;
  const pad = {l:50,r:20,t:20,b:30};
  const cW = W-pad.l-pad.r, cH = H-pad.t-pad.b;

  let html = '';
  // Grid lines
  for(let i=0;i<=4;i++){
    const y = pad.t + cH - (i/4)*cH;
    const val = maxV*(i/4);
    html += `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="rgba(200,170,100,.07)" stroke-width="1"/>`;
    html += `<text x="${pad.l-6}" y="${y+4}" text-anchor="end" font-size="9" fill="rgba(200,170,100,.4)">${fmt(val)}</text>`;
  }

  // Stacked area per rep
  const repCols = ['#c9a227','#4a9eca','#3dba6d','#c47a3e'];
  const repKeys = ['Erin Ryan Snyder','Zachary Salazar','Dylan White','Jonathan Izquierdo'];

  // Build stacked paths
  const stackedPath = (repIdx)=>{
    const pts = weeks.map((w,i)=>{
      const x = pad.l + (i/(n-1))*cW;
      let base = 0;
      for(let j=0;j<repIdx;j++) base += w[repKeys[j]]||0;
      const cur  = base + (w[repKeys[repIdx]]||0);
      const curY = pad.t + cH - (cur/maxV)*cH;
      return {x, y:curY, base: pad.t + cH - (base/maxV)*cH};
    });
    const top   = pts.map(p=>`${p.x},${p.y}`).join(' ');
    const bottom = [...pts].reverse().map(p=>`${p.x},${p.base}`).join(' ');
    return `<polygon points="${top} ${bottom}" fill="${repCols[repIdx]}" opacity="0.35"/>`;
  };

  for(let i=3;i>=0;i--) html += stackedPath(i);

  // Total line
  const totalLine = weeks.map((w,i)=>{
    const x = pad.l + (i/(n-1))*cW;
    const y = pad.t + cH - ((w.tot||0)/maxV)*cH;
    return `${i===0?'M':'L'}${x},${y}`;
  }).join(' ');
  html += `<path d="${totalLine}" fill="none" stroke="rgba(201,162,39,.6)" stroke-width="2"/>`;

  // X labels (every ~8 weeks)
  weeks.forEach((w,i)=>{
    if(i%8===0||i===n-1){
      const x = pad.l + (i/(n-1))*cW;
      html += `<text x="${x}" y="${H-6}" text-anchor="middle" font-size="8" fill="rgba(200,170,100,.4)">${w.week.slice(5)}</text>`;
    }
  });

  svg.innerHTML = html;

  // Update header stats
  const peak = Math.max(...weeks.map(w=>w.tot||0));
  const avg  = weeks.reduce((a,w)=>a+(w.tot||0),0)/weeks.filter(w=>w.tot>0).length;
  const peakEl = document.getElementById('weekly-peak');
  const avgEl  = document.getElementById('weekly-avg');
  if(peakEl) peakEl.textContent = fmt(peak);
  if(avgEl)  avgEl.textContent  = fmt(avg);
}

function drawMoMChart(){
  const svg = document.getElementById('momChart');
  if(!svg) return;
  const isLight = document.body.classList.contains('light');
  const goldCol  = isLight ? '#7a5500'              : '#c9a227';
  const goldMuted= isLight ? 'rgba(100,60,0,.55)'  : 'rgba(220,200,160,.92)';
  const goldDim  = isLight ? 'rgba(80,50,0,.5)'    : 'rgba(210,190,140,.82)';
  const gridCol  = isLight ? 'rgba(80,50,0,.08)'   : 'rgba(200,170,100,.12)';
  const yAxisCol = isLight ? 'rgba(80,50,0,.55)'   : 'rgba(210,185,120,.82)';
  const outlineCol= isLight? 'rgba(100,60,0,.5)'   : 'rgba(201,162,39,.7)';
  const W = svg.parentElement.clientWidth||900;
  const H = svg.parentElement.clientHeight||240;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);

  const months = DATA.monthly.slice(-3);   // only last 3
  const n      = months.length;            // 3
  const maxV   = Math.max(...months.map(m=>m.tot||0),1);
  const pad    = {l:72,r:24,t:36,b:42};
  const cW     = W-pad.l-pad.r;
  const cH     = H-pad.t-pad.b;
  const gap    = cW * 0.10;               // gap between bars
  const bW     = (cW - gap*(n+1)) / n;    // bar width
  const repKeys = REPS.map(r=>r.name);
  const repCols = REPS.map(r=>r.col);
  let html = '';

  // Grid lines + Y-axis labels
  for(let i=0;i<=4;i++){
    const y = pad.t + cH - (i/4)*cH;
    html += `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="${gridCol}" stroke-width="1"/>`;
    html += `<text x="${pad.l-10}" y="${(y+5).toFixed(1)}" text-anchor="end" font-size="15" font-weight="600" fill="${yAxisCol}">${fmt(maxV*(i/4))}</text>`;
  }

  // Bars
  months.forEach((m,i)=>{
    const isCur = i === n-1;
    const x     = pad.l + gap*(i+1) + bW*i;
    let base    = 0;

    // Stacked segments
    repKeys.forEach((k,ri)=>{
      const v  = m[k]||0;
      const bH = (v/maxV)*cH;
      const y  = pad.t + cH - (base/maxV)*cH - bH;
      if(bH > 0.5){
        html += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bW.toFixed(1)}" height="${bH.toFixed(1)}"
          fill="${repCols[ri]}" opacity="${isCur?0.72:0.88}" rx="3"/>`;
      }
      base += v;
    });

    // Current month: dashed outline
    if(isCur){
      const totH = (m.tot/maxV)*cH;
      const barY = pad.t + cH - totH;
      html += `<rect x="${(x-1).toFixed(1)}" y="${(barY-1).toFixed(1)}" width="${(bW+2).toFixed(1)}" height="${(totH+1).toFixed(1)}"
        fill="none" stroke="${outlineCol}" stroke-width="2" stroke-dasharray="5,3" rx="4"/>`;
    }

    // Total value label on top of bar
    const totH2 = (m.tot/maxV)*cH;
    if(m.tot>0){
      html += `<text x="${(x+bW/2).toFixed(1)}" y="${(pad.t+cH-totH2-10).toFixed(1)}"
        text-anchor="middle" font-size="17" font-weight="900"
        fill="${isCur?goldCol:goldMuted}">${fmt(m.tot)}</text>`;
    }

    // % change vs prior month
    if(i>0){
      const prev  = months[i-1].tot||1;
      const chgV  = ((m.tot-prev)/prev*100);
      const chgTx = (chgV>=0?'▲ ':'▼ ')+Math.abs(chgV).toFixed(1)+'%';
      const chgY  = pad.t + cH - totH2 - 30;
      html += `<text x="${(x+bW/2).toFixed(1)}" y="${chgY.toFixed(1)}"
        text-anchor="middle" font-size="13" font-weight="700"
        fill="${chgV>=0?'#3dba6d':'#e05252'}">${chgTx}</text>`;
    }

    // Month label below bar
    const lblY = pad.t + cH + 26;
    html += `<text x="${(x+bW/2).toFixed(1)}" y="${lblY.toFixed(1)}"
      text-anchor="middle" font-size="16" font-weight="${isCur?900:700}"
      fill="${isCur?goldCol:goldDim}">${m.label.toUpperCase()}${isCur?' MTD':''}</text>`;
  });

  svg.innerHTML = html;
}

// ── US MAP (D3 + TopoJSON) ─────────────────────────────────────────
let mapLoaded = false;
function initMap(){
  const mapSlide = document.getElementById('slide-9');
  if(!mapSlide) return;
  if(mapLoaded) return;

  const stateRevMap = {};
  (DATA.state_data_mo||DATA.state_data).forEach(s=>{ stateRevMap[s.state]=s.revenue; });
  const maxRev = Math.max(...Object.values(stateRevMap))||1;

  // Load D3 + TopoJSON dynamically
  const loadScript = (src)=>new Promise(res=>{
    if(document.querySelector(`script[src="${src}"]`)){res();return;}
    const s=document.createElement('script');
    s.src=src; s.onload=res; document.head.appendChild(s);
  });

  Promise.all([
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js'),
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js'),
  ]).then(()=>{
    fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
      .then(r=>r.json())
      .then(us=>{
        mapLoaded = true;
        const svg  = d3.select('#map-svg');
        const proj = d3.geoAlbersUsa().scale(900).translate([480,300]);
        const path = d3.geoPath().projection(proj);
        const states = topojson.feature(us, us.objects.states);
        const stateNames = {
          "01":"AL","02":"AK","04":"AZ","05":"AR","06":"CA","08":"CO","09":"CT",
          "10":"DE","11":"DC","12":"FL","13":"GA","15":"HI","16":"ID","17":"IL",
          "18":"IN","19":"IA","20":"KS","21":"KY","22":"LA","23":"ME","24":"MD",
          "25":"MA","26":"MI","27":"MN","28":"MS","29":"MO","30":"MT","31":"NE",
          "32":"NV","33":"NH","34":"NJ","35":"NM","36":"NY","37":"NC","38":"ND",
          "39":"OH","40":"OK","41":"OR","42":"PA","44":"RI","45":"SC","46":"SD",
          "47":"TN","48":"TX","49":"UT","50":"VT","51":"VA","53":"WA","54":"WV",
          "55":"WI","56":"WY"
        };
        svg.selectAll('path')
          .data(states.features)
          .join('path')
          .attr('d', path)
          .attr('fill', d=>{
            const abbr = stateNames[d.id.toString().padStart(2,'0')];
            const rev  = stateRevMap[abbr]||0;
            const isDark = !document.body.classList.contains('light');
            if(!rev) return isDark ? 'rgba(255,255,255,.09)' : 'rgba(80,60,20,.12)';
            const intens = rev/maxRev;
            return `rgba(201,162,39,${0.25+intens*0.75})`;
          })
          .attr('stroke', document.body.classList.contains('light') ? 'rgba(80,60,10,.5)' : 'rgba(201,162,39,.45)')
          .attr('stroke-width','1');
      }).catch(()=>{
        document.getElementById('map-svg').innerHTML = '<text x="480" y="300" text-anchor="middle" fill="rgba(201,162,39,.4)" font-size="16">Map data unavailable offline</text>';
      });
  });
}

// ── COUNT-UP ───────────────────────────────────────────────────────
function countUp(){
  document.querySelectorAll('[data-cu]').forEach(el=>{
    const target = parseFloat(el.dataset.cu)||0;
    const isK    = el.dataset.cuK;
    const isPlain= el.dataset.cuPlain;
    const prefix = el.dataset.cuPrefix||'';
    const dur = 1200, fps=60, frames=dur/1000*fps;
    let f=0;
    const iv = setInterval(()=>{
      f++;
      const v = target*(f/frames);
      if(isPlain) el.textContent = Math.round(v).toLocaleString();
      else if(isK) el.textContent = prefix + (v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':v.toFixed(0));
      else el.textContent = prefix + Math.round(v).toLocaleString();
      if(f>=frames){
        clearInterval(iv);
        if('cuFlash' in el.dataset){
          el.classList.remove('cu-glow');
          requestAnimationFrame(()=>requestAnimationFrame(()=>{
            el.classList.add('cu-glow');
          }));
        }
      }
    },1000/fps);
  });
}

function buildProgressBars(){
  // bars animate via CSS transition — just set widths to target
  document.querySelectorAll('[data-bar]').forEach(el=>{
    const w = el.dataset.bar;
    el.style.width = '0%';
    setTimeout(()=>{ el.style.width = w+'%'; },100);
  });
}

// ── SLIDE SHOW ─────────────────────────────────────────────────────
function goTo(idx){
  const slides = document.querySelectorAll('.slide');
  const dots   = document.querySelectorAll('.dot');
  if(currentSlide===idx) return;
  slides[currentSlide].classList.remove('active');
  slides[currentSlide].classList.add('exit');
  setTimeout(()=>slides[currentSlide]&&slides[currentSlide].classList.remove('exit'),600);
  currentSlide = idx;
  slides[currentSlide].classList.add('active');
  dots.forEach((d,i)=>d.classList.toggle('active',i===idx));
  resetProgress();
  // Draw charts when their slide becomes active
  if(idx===7) setTimeout(drawWeeklyChart,80);
  if(idx===8) setTimeout(drawMoMChart,80);
  if(idx===9) setTimeout(initMap,80);
  // Count-up + flash on New Accounts slide (last slide)
  if(idx===SLIDE_NAMES.length-1){
    setTimeout(()=>{
      const hero = document.querySelector('#slide-11 .new-hero-num');
      if(!hero) return;
      const target = parseInt(hero.dataset.cu)||0;
      hero.classList.remove('flash');
      hero.textContent = '0';
      const dur=1200, fps=60, frames=Math.round(dur/1000*fps);
      let f=0;
      const iv=setInterval(()=>{
        f++;
        hero.textContent = Math.round(target*(f/frames)).toLocaleString();
        if(f>=frames){
          clearInterval(iv);
          hero.textContent = target.toLocaleString();
          hero.classList.remove('flash');
          void hero.offsetWidth; // force reflow to restart animation
          hero.classList.add('flash');
        }
      },1000/fps);
    },150);
  }
}

function nextSlide(){
  goTo((currentSlide+1)%SLIDE_NAMES.length);
}

function startTimer(){
  clearTimeout(showTimer);
  timerRemaining = timerDuration;
  timerStart     = Date.now();
  showTimer = setTimeout(nextSlide, timerDuration);
}

function resetProgress(){
  const bar = document.getElementById('slideProgress');
  bar.style.transition='none';
  bar.style.width='0%';
  setTimeout(()=>{
    bar.style.transition=`width ${timerDuration}ms linear`;
    bar.style.width='100%';
  },20);
  startTimer();
}

function pauseShow(){
  if(paused) return;
  paused = true;
  timerRemaining -= (Date.now()-timerStart);
  clearTimeout(showTimer);
  document.getElementById('pauseIndicator').classList.add('show');
  const bar = document.getElementById('slideProgress');
  const w = parseFloat(bar.style.width)||0;
  bar.style.transition='none';
  bar.style.width=w+'%';
}

function resumeShow(){
  if(!paused) return;
  paused = false;
  document.getElementById('pauseIndicator').classList.remove('show');
  timerStart = Date.now();
  showTimer  = setTimeout(nextSlide, timerRemaining);
  const bar = document.getElementById('slideProgress');
  bar.style.transition=`width ${timerRemaining}ms linear`;
  bar.style.width='100%';
}

// ── GATE ───────────────────────────────────────────────────────────
function unlockApp(){
  document.getElementById('gate').style.display='none';
  const app = document.getElementById('app');
  app.style.display='flex';
  app.style.flexDirection='column';
  document.getElementById('themeToggle').classList.add('visible');
  buildTicker();
  render();
  // Last Updated timestamp in EST
  (function(){
    const genDate = new Date((DATA.generated_ts || DATA.generated + 'T12:00:00') + (DATA.generated_ts ? '' : ''));
    const opts = {timeZone:'America/New_York',month:'numeric',day:'numeric',year:'2-digit',hour:'numeric',minute:'2-digit',hour12:true,timeZoneName:'short'};
    const ts = genDate.toLocaleString('en-US', opts);
    const el = document.getElementById('lastUpdated');
    if(el) el.textContent = 'Last Updated: ' + ts;
  })();
  // Show first slide
  setTimeout(()=>{
    const slides = document.querySelectorAll('.slide');
    if(slides[0]) slides[0].classList.add('active');
    resetProgress();
  },50);
}

document.getElementById('gateBtn').addEventListener('click',()=>{
  const pw = document.getElementById('pwInput').value.toUpperCase().trim();
  if(pw==='LFGBOCA'){ unlockApp(); }
  else{ document.getElementById('gateErr').textContent='Invalid access code'; setTimeout(()=>document.getElementById('gateErr').textContent='',2000); }
});

// ── THEME TOGGLE ───────────────────────────────────────────────────
let lightMode = localStorage.getItem('jms_light')==='1';
function applyTheme(){
  document.body.classList.toggle('light', lightMode);
  document.getElementById('themeToggle').textContent = lightMode?'🌙 DARK':'☀ LIGHT';
}
document.getElementById('themeToggle').addEventListener('click',()=>{
  lightMode=!lightMode;
  localStorage.setItem('jms_light',lightMode?'1':'0');
  applyTheme();
});
applyTheme();

// ── HOVER PAUSE ────────────────────────────────────────────────────
const slideshow = document.getElementById('slideshow');
// Use event delegation after render
document.addEventListener('mouseover',e=>{
  if(e.target.closest('#slideshow')) pauseShow();
});
document.addEventListener('mouseout',e=>{
  if(e.target.closest('#slideshow') && !e.relatedTarget?.closest('#slideshow')) resumeShow();
});

// ── KEYBOARD ───────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') nextSlide();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') goTo((currentSlide-1+SLIDE_NAMES.length)%SLIDE_NAMES.length);
  if(e.key===' '){e.preventDefault(); paused?resumeShow():pauseShow();}
});
