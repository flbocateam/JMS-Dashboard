<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMS Sales Floor — Live Stats</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#080c18; color:#fff; width:100vw; height:100vh; overflow:hidden; }

/* ── PASSWORD GATE ── */
#gate {
  position:fixed; inset:0; background:#080c18; z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;
}
.gate-brand {
  font-size:2.8rem; font-weight:900; letter-spacing:.14em;
  background:linear-gradient(90deg,#00d4ff,#7b2ff7);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.gate-sub { font-size:.95rem; color:#444; letter-spacing:.08em; margin-top:-14px; }
.gate-box {
  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);
  border-radius:18px; padding:36px 44px; display:flex; flex-direction:column;
  align-items:center; gap:18px; width:340px;
}
.gate-label { font-size:.75rem; color:#555; letter-spacing:.1em; text-transform:uppercase; align-self:flex-start; }
.gate-input {
  width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
  border-radius:10px; padding:14px 18px; color:#fff; font-size:1.1rem;
  font-family:'Inter',sans-serif; letter-spacing:.12em; outline:none;
  transition:border-color .2s;
}
.gate-input:focus { border-color:rgba(0,212,255,.4); }
.gate-btn {
  width:100%; background:linear-gradient(90deg,#00d4ff,#7b2ff7);
  border:none; border-radius:10px; padding:14px; color:#fff;
  font-size:1rem; font-weight:700; letter-spacing:.06em; cursor:pointer;
  transition:opacity .2s;
}
.gate-btn:hover { opacity:.85; }
.gate-error { font-size:.82rem; color:#ff5252; display:none; }
.gate-error.show { display:block; }

/* ── SLIDESHOW ── */
.slideshow { width:100%; height:100%; position:relative; }
.slide { position:absolute; inset:0; display:flex; flex-direction:column; opacity:0; transition:opacity .8s ease; pointer-events:none; }
.slide.active { opacity:1; pointer-events:all; }

/* ── PROGRESS BAR ── */
.progress-bar { position:fixed; bottom:0; left:0; height:4px; background:linear-gradient(90deg,#00d4ff,#7b2ff7); width:0%; z-index:100; }

/* ── INDICATORS ── */
.indicators { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:100; }
.dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.25); transition:background .4s,transform .4s; cursor:pointer; }
.dot.active { background:#00d4ff; transform:scale(1.5); }

/* ── TICKER ── */
.ticker { position:fixed; top:0; left:0; right:0; height:40px; background:rgba(8,12,24,.85); border-bottom:1px solid rgba(255,255,255,.07); backdrop-filter:blur(10px); display:flex; align-items:center; overflow:hidden; z-index:50; }
.ticker-inner { display:flex; gap:70px; white-space:nowrap; animation:tick 50s linear infinite; padding-left:100%; }
@keyframes tick { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
.ticker-item { font-size:.74rem; letter-spacing:.05em; color:#777; }
.ticker-item strong { color:#bbb; }
.ti-up { color:#00e676; } .ti-dn { color:#ff5252; }

/* ── SHARED HEADER ── */
.slide-header { margin-top:40px; padding:22px 56px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,.06); flex-shrink:0; }
.brand { font-size:1.9rem; font-weight:900; letter-spacing:.14em; background:linear-gradient(90deg,#00d4ff,#7b2ff7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.brand-sm { font-size:.95rem; font-weight:700; letter-spacing:.14em; color:#444; }
.hdr-center { font-size:1rem; color:#555; letter-spacing:.05em; }
.hdr-badge { background:rgba(0,212,255,.08); border:1px solid rgba(0,212,255,.2); border-radius:40px; padding:8px 22px; font-size:.9rem; color:#00d4ff; font-weight:600; letter-spacing:.04em; }

/* ════════════════════════════════════
   SLIDE: LEADERBOARD
════════════════════════════════════ */
.slide-lb { background:linear-gradient(135deg,#080c18 0%,#0d1f3c 55%,#080c18 100%); }
.lb-body { flex:1; display:flex; flex-direction:column; justify-content:center; padding:16px 56px 50px; gap:10px; }
.lb-row { display:grid; grid-template-columns:52px 1fr 60px 60px 180px 180px 130px; align-items:center; gap:16px; background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.05); border-radius:14px; padding:16px 24px; }
.lb-row.r1 { background:linear-gradient(90deg,rgba(255,215,0,.1),transparent); border-color:rgba(255,215,0,.2); }
.lb-row.r2 { background:linear-gradient(90deg,rgba(192,192,192,.07),transparent); border-color:rgba(192,192,192,.18); }
.lb-row.r3 { background:linear-gradient(90deg,rgba(205,127,50,.07),transparent); border-color:rgba(205,127,50,.18); }
.rank-ico { font-size:1.7rem; text-align:center; }
.rep-name { font-size:1.2rem; font-weight:700; }
.rep-sub { font-size:.75rem; color:#666; margin-top:2px; }
.plat-pill { font-size:.65rem; font-weight:700; letter-spacing:.06em; padding:3px 8px; border-radius:99px; text-align:center; }
.plat-boom { background:rgba(0,212,255,.15); color:#00d4ff; }
.plat-bulk { background:rgba(123,47,247,.15); color:#a78bfa; }
.bar-bg { height:8px; background:rgba(255,255,255,.07); border-radius:99px; overflow:hidden; }
.bar-fill { height:100%; border-radius:99px; }
.r1 .bar-fill { background:linear-gradient(90deg,#ffd700,#ff8c00); }
.r2 .bar-fill { background:linear-gradient(90deg,#a0a0a0,#606060); }
.r3 .bar-fill { background:linear-gradient(90deg,#cd7f32,#8b4513); }
.r4 .bar-fill,.r5 .bar-fill,.r6 .bar-fill { background:linear-gradient(90deg,#00d4ff,#7b2ff7); }
.lb-rev { text-align:right; font-size:1.45rem; font-weight:800; }
.r1 .lb-rev { color:#ffd700; } .r2 .lb-rev { color:#c0c0c0; } .r3 .lb-rev { color:#cd7f32; }
.lb-ord { text-align:right; font-size:.85rem; color:#888; }
.lb-ord span { display:block; font-size:.65rem; color:#555; margin-top:1px; }

/* ════════════════════════════════════
   SLIDE: WEEKLY TEAM TREND
════════════════════════════════════ */
.slide-trend { background:linear-gradient(160deg,#080c18,#0a1428,#080c18); }
.trend-body { flex:1; display:grid; grid-template-columns:1fr 340px; gap:0; }

.trend-chart-panel { padding:28px 40px 50px 56px; display:flex; flex-direction:column; border-right:1px solid rgba(255,255,255,.06); }
.trend-chart-panel .panel-title { font-size:.75rem; color:#555; letter-spacing:.1em; text-transform:uppercase; margin-bottom:18px; }
.weekly-bars { display:flex; align-items:flex-end; gap:10px; flex:1; }
.wk-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
.wk-bar-wrap { flex:1; width:100%; display:flex; align-items:flex-end; }
.wk-bar { width:100%; border-radius:5px 5px 0 0; min-height:3px; position:relative; transition:opacity .3s; }
.wk-bar.peak { box-shadow:0 0 20px rgba(255,215,0,.5); }
.wk-bar.current { box-shadow:0 0 14px rgba(0,212,255,.4); }
.wk-val { font-size:.62rem; color:#aaa; font-weight:600; white-space:nowrap; }
.wk-lbl { font-size:.6rem; color:#444; white-space:nowrap; }
.wk-lbl.hl { color:#00d4ff; }

.trend-stats-panel { padding:28px 32px; display:flex; flex-direction:column; gap:20px; justify-content:center; }
.trend-stat-card { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:14px; padding:18px 20px; }
.tsc-label { font-size:.7rem; color:#555; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; }
.tsc-val { font-size:2rem; font-weight:900; }
.tsc-sub { font-size:.75rem; color:#666; margin-top:4px; }
.green { color:#00e676; } .red { color:#ff5252; } .gold { color:#ffd700; } .cyan { color:#00d4ff; }

/* ════════════════════════════════════
   SLIDE: PROJECTION vs ACTUAL
════════════════════════════════════ */
.slide-pva { background:linear-gradient(160deg,#080c18,#0c1a14,#080c18); }
.pva-body { flex:1; display:grid; grid-template-columns:1fr 320px; }

.pva-chart { padding:24px 36px 50px 56px; display:flex; flex-direction:column; border-right:1px solid rgba(255,255,255,.06); }
.pva-chart .panel-title { font-size:.75rem; color:#555; letter-spacing:.1em; text-transform:uppercase; margin-bottom:16px; }
.pva-weeks { display:flex; flex-direction:column; gap:10px; flex:1; justify-content:center; }
.pva-row { display:grid; grid-template-columns:70px 1fr 1fr 90px; align-items:center; gap:12px; }
.pva-date { font-size:.75rem; color:#666; white-space:nowrap; }
.pva-bar-wrap { position:relative; height:24px; background:rgba(255,255,255,.05); border-radius:6px; overflow:visible; }
.pva-bar-proj { position:absolute; top:4px; height:8px; border-radius:3px; background:rgba(255,255,255,.2); }
.pva-bar-act { position:absolute; bottom:4px; height:8px; border-radius:3px; }
.pva-bar-act.over { background:linear-gradient(90deg,#00e676,#00b0ff); }
.pva-bar-act.under { background:linear-gradient(90deg,#ff6b6b,#ff8e53); }
.pva-var { font-size:.85rem; font-weight:700; text-align:right; }
.pva-legend { display:flex; gap:16px; margin-bottom:14px; }
.pva-leg-item { display:flex; align-items:center; gap:6px; font-size:.72rem; color:#666; }
.pva-leg-box { width:12px; height:6px; border-radius:2px; }

.pva-sidebar { padding:24px 28px; display:flex; flex-direction:column; gap:16px; justify-content:center; }
.pva-cumcard { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:14px; padding:20px; text-align:center; }
.pva-cumcard .lbl { font-size:.7rem; color:#555; letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px; }
.pva-cumcard .val { font-size:2.4rem; font-weight:900; }
.pva-cumcard .sub { font-size:.75rem; color:#666; margin-top:6px; }
.pva-clinic-table { display:flex; flex-direction:column; gap:8px; }
.pva-clinic-row { display:flex; justify-content:space-between; align-items:center; font-size:.82rem; padding:8px 12px; background:rgba(255,255,255,.02); border-radius:8px; border:1px solid rgba(255,255,255,.05); }
.pva-clinic-row .dt { color:#666; } .pva-clinic-row .proj { color:#555; } .pva-clinic-row .act { font-weight:700; }
.pva-clinic-row .diff.pos { color:#00e676; } .pva-clinic-row .diff.neg { color:#ff5252; }

/* ════════════════════════════════════
   SLIDE: NEW CLINICS
════════════════════════════════════ */
.slide-clinics { background:linear-gradient(160deg,#080c18,#0e1220,#080c18); }
.clinics-body { flex:1; display:grid; grid-template-columns:1fr 1fr; }
.nc-panel { padding:28px 40px; border-right:1px solid rgba(255,255,255,.06); display:flex; flex-direction:column; }
.nc-panel:last-child { border-right:none; }
.nc-panel .panel-title { font-size:.75rem; color:#555; letter-spacing:.1em; text-transform:uppercase; margin-bottom:16px; }
.nc-bar-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.nc-rep-name { font-size:.85rem; color:#ccc; font-weight:600; width:120px; flex-shrink:0; }
.nc-bar-bg { flex:1; height:10px; background:rgba(255,255,255,.06); border-radius:99px; overflow:hidden; }
.nc-bar-fill { height:100%; border-radius:99px; }
.nc-val { font-size:.9rem; font-weight:700; width:36px; text-align:right; }

.monthly-clinics { display:flex; flex-direction:column; gap:10px; flex:1; justify-content:center; }
.mc-month { background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:14px 18px; }
.mc-month-name { font-size:.7rem; color:#555; letter-spacing:.08em; text-transform:uppercase; margin-bottom:10px; }
.mc-rep-bars { display:flex; flex-direction:column; gap:5px; }
.mc-rep-row { display:flex; align-items:center; gap:10px; }
.mc-rep-nm { font-size:.7rem; color:#888; width:80px; flex-shrink:0; }
.mc-rep-bar { height:7px; border-radius:99px; }
.mc-rep-val { font-size:.7rem; color:#aaa; margin-left:4px; }

/* ════════════════════════════════════
   SLIDE: INDIVIDUAL REP
════════════════════════════════════ */
.slide-rep { }
.rep-body { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }

.panel { padding:28px 42px; border-right:1px solid rgba(255,255,255,.055); border-bottom:1px solid rgba(255,255,255,.055); display:flex; flex-direction:column; justify-content:center; }
.panel:nth-child(2n) { border-right:none; }
.panel:nth-child(3),.panel:nth-child(4) { border-bottom:none; }
.panel-title { font-size:.72rem; color:#555; letter-spacing:.1em; text-transform:uppercase; margin-bottom:14px; }
.panel.alt-bg { background:rgba(255,255,255,.015); }

/* Name panel */
.rank-badge { display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.05); border-radius:99px; padding:5px 16px; font-size:.8rem; color:#888; letter-spacing:.05em; margin-bottom:14px; width:fit-content; border:1px solid rgba(255,255,255,.08); }
.rep-big-name { font-size:2.5rem; font-weight:900; line-height:1.08; letter-spacing:-.01em; }
.period-tag { margin-top:12px; font-size:.8rem; color:#444; letter-spacing:.05em; }
.platform-split { display:flex; gap:10px; margin-top:14px; }
.ps-pill { display:flex; flex-direction:column; padding:8px 14px; border-radius:10px; }
.ps-boom { background:rgba(0,212,255,.07); border:1px solid rgba(0,212,255,.15); }
.ps-bulk { background:rgba(123,47,247,.07); border:1px solid rgba(123,47,247,.15); }
.ps-lbl { font-size:.62rem; color:#666; letter-spacing:.08em; margin-bottom:3px; }
.ps-val { font-size:1rem; font-weight:700; }
.ps-boom .ps-val { color:#00d4ff; } .ps-bulk .ps-val { color:#a78bfa; }
.ps-pct { font-size:.65rem; color:#555; margin-top:1px; }

/* Revenue panel */
.rev-label { font-size:.75rem; color:#666; letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px; }
.rev-amount { font-size:4rem; font-weight:900; line-height:1; letter-spacing:-.02em; }
.sub-stats { display:flex; gap:30px; margin-top:18px; flex-wrap:wrap; }
.sub-stat .val { font-size:1.5rem; font-weight:800; }
.sub-stat .lbl { font-size:.68rem; color:#555; letter-spacing:.07em; text-transform:uppercase; margin-top:2px; }
.new-clinics-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(0,230,118,.07); border:1px solid rgba(0,230,118,.2); border-radius:99px; padding:5px 14px; font-size:.8rem; color:#00e676; font-weight:600; margin-top:16px; width:fit-content; }

/* Weekly trend panel */
.rep-weekly-bars { display:flex; align-items:flex-end; gap:5px; height:110px; }
.rwk-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
.rwk-bar-wrap { flex:1; width:100%; display:flex; align-items:flex-end; }
.rwk-bar { width:100%; border-radius:3px 3px 0 0; min-height:2px; }
.rwk-bar.peak { opacity:1; }
.rwk-lbl { font-size:.52rem; color:#444; writing-mode:vertical-rl; text-orientation:mixed; transform:rotate(180deg); height:28px; line-height:1; }

/* Drug panel */
.drug-row { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.045); }
.drug-row:last-child { border-bottom:none; }
.drug-num { font-size:.8rem; color:#3a3a3a; font-weight:700; width:18px; }
.drug-name { flex:1; font-size:.92rem; font-weight:600; color:#ccc; }
.drug-rev { font-size:.95rem; font-weight:700; }

/* ── THEME COLORS ── */
.theme-0 { --ac:#ffd700; --ac2:#ff8c00; }
.theme-1 { --ac:#00d4ff; --ac2:#7b2ff7; }
.theme-2 { --ac:#00e676; --ac2:#00b0ff; }
.theme-3 { --ac:#ff6b6b; --ac2:#ff8e53; }
.theme-4 { --ac:#a78bfa; --ac2:#ec4899; }
.theme-5 { --ac:#34d399; --ac2:#06b6d4; }

.theme-0 .rep-big-name,.theme-0 .rev-amount,.theme-0 .sub-stat .val,.theme-0 .drug-rev { color:var(--ac); }
.theme-0 .rwk-bar { background:linear-gradient(180deg,var(--ac),var(--ac2)); }
.theme-0 .rank-badge { border-color:rgba(255,215,0,.2); }
.theme-0 .new-clinics-badge { border-color:rgba(255,215,0,.25); color:var(--ac); background:rgba(255,215,0,.06); }

.theme-1 .rep-big-name,.theme-1 .rev-amount,.theme-1 .sub-stat .val,.theme-1 .drug-rev { color:var(--ac); }
.theme-1 .rwk-bar { background:linear-gradient(180deg,var(--ac),var(--ac2)); }
.theme-1 .rank-badge { border-color:rgba(0,212,255,.2); }

.theme-2 .rep-big-name,.theme-2 .rev-amount,.theme-2 .sub-stat .val,.theme-2 .drug-rev { color:var(--ac); }
.theme-2 .rwk-bar { background:linear-gradient(180deg,var(--ac),var(--ac2)); }
.theme-2 .rank-badge { border-color:rgba(0,230,118,.2); }

.theme-3 .rep-big-name,.theme-3 .rev-amount,.theme-3 .sub-stat .val,.theme-3 .drug-rev { color:var(--ac); }
.theme-3 .rwk-bar { background:linear-gradient(180deg,var(--ac),var(--ac2)); }

.theme-4 .rep-big-name,.theme-4 .rev-amount,.theme-4 .sub-stat .val,.theme-4 .drug-rev { color:var(--ac); }
.theme-4 .rwk-bar { background:linear-gradient(180deg,var(--ac),var(--ac2)); }

.theme-5 .rep-big-name,.theme-5 .rev-amount,.theme-5 .sub-stat .val,.theme-5 .drug-rev { color:var(--ac); }
.theme-5 .rwk-bar { background:linear-gradient(180deg,var(--ac),var(--ac2)); }

/* ════════════════════════════════════
   SLIDE: CLINIC LEADERBOARD
════════════════════════════════════ */
.slide-clb { background:linear-gradient(135deg,#080c18 0%,#0d1a2e 55%,#080c18 100%); }
.clb-body { flex:1; display:flex; flex-direction:column; justify-content:center; padding:10px 56px 44px; gap:7px; }
.clb-row { display:grid; grid-template-columns:46px 1fr 52px 120px 120px 170px 90px; align-items:center; gap:14px;
  background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.05); border-radius:12px; padding:13px 22px; }
.clb-row.cr1 { background:linear-gradient(90deg,rgba(255,215,0,.09),transparent); border-color:rgba(255,215,0,.22); }
.clb-row.cr2 { background:linear-gradient(90deg,rgba(192,192,192,.07),transparent); border-color:rgba(192,192,192,.18); }
.clb-row.cr3 { background:linear-gradient(90deg,rgba(205,127,50,.07),transparent); border-color:rgba(205,127,50,.18); }
.clb-rank { font-size:1.5rem; text-align:center; }
.clb-name { font-size:1.05rem; font-weight:700; }
.clb-sub { font-size:.7rem; color:#555; margin-top:2px; }
.clb-state { background:rgba(123,47,247,.15); border:1px solid rgba(123,47,247,.25); border-radius:6px;
  font-size:.75rem; font-weight:700; color:#a78bfa; padding:4px 10px; text-align:center; }
.clb-bar-bg { height:7px; background:rgba(255,255,255,.07); border-radius:99px; overflow:hidden; }
.clb-bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,#00d4ff,#7b2ff7); }
.cr1 .clb-bar-fill { background:linear-gradient(90deg,#ffd700,#ff8c00); }
.cr2 .clb-bar-fill { background:linear-gradient(90deg,#a0a0a0,#606060); }
.cr3 .clb-bar-fill { background:linear-gradient(90deg,#cd7f32,#8b4513); }
.clb-rev { text-align:right; font-size:1.3rem; font-weight:800; }
.cr1 .clb-rev { color:#ffd700; } .cr2 .clb-rev { color:#c0c0c0; } .cr3 .clb-rev { color:#cd7f32; }
.clb-rx { text-align:right; font-size:.82rem; color:#888; }
.clb-rx span { display:block; font-size:.6rem; color:#555; margin-top:1px; }

/* ════════════════════════════════════
   SLIDE: CLINIC PERFORMANCE CARDS
════════════════════════════════════ */
.slide-cpc { background:linear-gradient(160deg,#080c18,#0b1522,#080c18); }
.cpc-body { flex:1; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:1fr 1fr; gap:0; }
.cpc-card { padding:20px 22px; border-right:1px solid rgba(255,255,255,.055); border-bottom:1px solid rgba(255,255,255,.055);
  display:flex; flex-direction:column; gap:8px; }
.cpc-card:nth-child(4n) { border-right:none; }
.cpc-card:nth-child(5),.cpc-card:nth-child(6),.cpc-card:nth-child(7),.cpc-card:nth-child(8) { border-bottom:none; }
.cpc-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }

// ─── SLIDE: INDIVIDUAL REP ───────────────────────────────────────
function slideRep(r, idx) {
  const maxWk = Math.max(...r.weekly);
  const peakIdx = r.weekly.findIndex(v=>v===maxWk);
  const lastWk = r.weekly[r.weekly.length-1];
  const prevWk = r.weekly[r.weekly.length-2];
  const wkTrend = lastWk >= prevWk;
  const newTotal = r.newClinics.mar + r.newClinics.apr + r.newClinics.may;
  const shareStr = (r.revenue/totalRevenue*100).toFixed(1);
  const avgOrd = fmt(r.revenue/r.orders);

  // Platform split
  let platformHTML = '';
  if (r.boom !== null) {
    const boomPct = (r.boom/r.revenue*100).toFixed(0);
    const bulkPct = (r.bulk/r.revenue*100).toFixed(0);
    platformHTML = `
    <div class="platform-split">
      <div class="ps-pill ps-boom"><div class="ps-lbl">BOOMRX</div><div class="ps-val">${fmt(r.boom)}</div><div class="ps-pct">${boomPct}% of revenue</div></div>
      <div class="ps-pill ps-bulk"><div class="ps-lbl">BULK</div><div class="ps-val">${fmt(r.bulk)}</div><div class="ps-pct">${bulkPct}% of revenue</div></div>
    </div>`;
  }

  // Weekly bars
  const wkBars = weeks.map((w,i) => {
    const h = maxWk > 0 ? Math.max(2, (r.weekly[i]/maxWk*100)).toFixed(1) : 2;
    const extra = i === peakIdx ? ' peak' : '';
    return `<div class="rwk-col">
      <div class="rwk-bar-wrap"><div class="rwk-bar${extra}" style="height:${h}%"></div></div>
      <div class="rwk-lbl">${w.lbl}</div>
    </div>`;
  }).join('');

  // Drug rows
  const drugRows = r.topDrugs.map((d,di) => `
  <div class="drug-row">
    <div class="drug-num">${di+1}</div>
    <div class="drug-name">${d.name}</div>
    <div class="drug-rev">${fmt(d.rev)}</div>
  </div>`).join('');

  return `
  <div class="slide slide-rep theme-${r.theme}" id="s${idx+3}">
    <div class="slide-header">
      <div class="brand-sm">JMS SALES</div>
      <div class="hdr-center">${PERIOD}</div>
      <div class="brand-sm">Rank #${r.rank} of ${reps.length}</div>
    </div>
    <div class="rep-body">

      <div class="panel">
        <div class="rank-badge">${rankEmoji[r.rank-1]} &nbsp; Rank #${r.rank}</div>
        <div class="rep-big-name">${r.name}</div>
        <div class="period-tag">${shareStr}% of team revenue</div>
        ${platformHTML}
        <div class="new-clinics-badge">✦ ${newTotal} new clinics onboarded</div>
      </div>

      <div class="panel alt-bg">
        <div class="rev-label">Total Revenue</div>
        <div class="rev-amount">${fmt(r.revenue)}</div>
        <div class="sub-stats">
          <div class="sub-stat"><div class="val">${r.orders.toLocaleString()}</div><div class="lbl">Orders</div></div>
          <div class="sub-stat"><div class="val">${r.clinics}</div><div class="lbl">Clinics</div></div>
          <div class="sub-stat"><div class="val">${avgOrd}</div><div class="lbl">Avg Order</div></div>
          <div class="sub-stat"><div class="val ${wkTrend?'green':'red'}">${wkTrend?'▲':'▼'}</div><div class="lbl">Wk Trend</div></div>
        </div>
        <div style="margin-top:16px;display:flex;gap:18px">
          <div style="text-align:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 16px">
            <div style="font-size:1.2rem;font-weight:800;color:#a78bfa">${r.activeClinics.mar}</div>
            <div style="font-size:.65rem;color:#555;margin-top:2px">Mar Clinics</div>
          </div>
          <div style="text-align:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 16px">
            <div style="font-size:1.2rem;font-weight:800;color:#a78bfa">${r.activeClinics.apr}</div>
            <div style="font-size:.65rem;color:#555;margin-top:2px">Apr Clinics</div>
          </div>
          <div style="text-align:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 16px">
            <div style="font-size:1.2rem;font-weight:800;color:#a78bfa">${r.activeClinics.may}</div>
            <div style="font-size:.65rem;color:#555;margin-top:2px">May Clinics</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">12-Week Revenue Trend &nbsp; <span style="font-size:.65rem;color:#555">${fmt(lastWk)} this week</span></div>
        <div class="rep-weekly-bars">${wkBars}</div>
      </div>

      <div class="panel alt-bg">
        <div class="panel-title">Top Products by Revenue</div>
        ${drugRows}
        <div style="margin-top:16px;display:flex;gap:16px">
          <div style="background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;text-align:center">
            <div style="font-size:1.1rem;font-weight:800;color:#00e676">${r.newClinics.mar}</div>
            <div style="font-size:.6rem;color:#555;margin-top:2px">New Mar</div>
          </div>
          <div style="background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;text-align:center">
            <div style="font-size:1.1rem;font-weight:800;color:#00e676">${r.newClinics.apr}</div>
            <div style="font-size:.6rem;color:#555;margin-top:2px">New Apr</div>
          </div>
          <div style="background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;text-align:center">

// ─── SLIDE: CLINIC LEADERBOARD ───────────────────────────────────
function slideClinicLeaderboard() {
  const rankIco = ["🥇","🥈","🥉","4️⃣","5️⃣","6️⃣","7️⃣","8️⃣","9️⃣","🔟"];
  const maxRev = topClinics[0].revenue;
  const rows = topClinics.map((c,i) => {
    const crCls = i < 3 ? ` cr${i+1}` : '';
    const barW = Math.max(4, (c.revenue / maxRev * 100)).toFixed(1);
    const marginColor = c.margin >= 20 ? '#00e676' : c.margin >= 15 ? '#ffd700' : '#00d4ff';
    return `
    <div class="clb-row${crCls}">
      <div class="clb-rank">${rankIco[i]}</div>
      <div>
        <div class="clb-name">${c.name}</div>
        <div class="clb-sub">${c.rx} Rx &nbsp;·&nbsp; Avg ${fmt(c.avgOrder)}/order &nbsp;·&nbsp; <span style="color:${marginColor}">${c.margin}% margin</span></div>
      </div>
      <div class="clb-state">${c.state}</div>
      <div style="font-size:.68rem;color:#666;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${c.topDrug}</div>
      <div class="clb-bar-bg"><div class="clb-bar-fill" style="width:${barW}%"></div></div>
      <div class="clb-rev">${fmt(c.revenue)}</div>
      <div class="clb-rx">${fmt(c.profit)}<span>profit</span></div>
    </div>`;
  }).join('');

  return `
  <div class="slide slide-clb" id="sc0">
    <div class="slide-header">
      <div class="brand">JMS SALES</div>
      <div class="hdr-center">Top Clinic Rankings &nbsp;·&nbsp; ${CLINIC_PERIOD}</div>
      <div class="hdr-badge">${clinicData.totalClinics} Active Clinics &nbsp; ${fmt(clinicData.totalRevenue)} Rev</div>
    </div>
    <div class="clb-body">${rows}</div>
  </div>`;
}

    const rankColors = ['#ffd700','#c0c0c0','#cd7f32','#00d4ff','#00d4ff','#a78bfa','#a78bfa','#34d399'];
    return `

// ─── SLIDE: STATE BREAKDOWN ───────────────────────────────────────
function slideStateBreakdown() {
  const maxRev = stateData[0].revenue;
  const totalStateRev = stateData.reduce((s,d)=>s+d.revenue,0);

  const bars = stateData.map((d,i) => {
    const barW = Math.max(3, (d.revenue / maxRev * 100)).toFixed(1);
    const gradients = [
      'linear-gradient(90deg,#ffd700,#ff8c00)',
      'linear-gradient(90deg,#00d4ff,#7b2ff7)',
      'linear-gradient(90deg,#00e676,#00b0ff)',
      'linear-gradient(90deg,#a78bfa,#ec4899)',
      'linear-gradient(90deg,#ff6b6b,#ff8e53)',
      'linear-gradient(90deg,#34d399,#06b6d4)',

    const grad = gradients[i % gradients.length];
    const marginColor = (d.profit/d.revenue*100) >= 15 ? '#00e676' : '#00d4ff';

    <div class="state-row">
      <div class="state-name">${d.state}</div>
      <div class="state-bar-bg">
        <div class="state-bar-fill" style="width:${barW}%;background:${grad}"></div>
        <div class="state-bar-label">${d.clinics} clinic${d.clinics>1?'s':''} &nbsp;·&nbsp; ${d.rx} Rx</div>
      </div>
      <div class="state-rev">${fmt(d.revenue)}</div>
      <div class="state-clinics" style="color:${marginColor}">${(d.profit/d.revenue*100).toFixed(0)}% mgn</div>
    </div>`;
  }).join('');

  return `
  <div class="slide slide-state" id="sc2">
    <div class="slide-header">
      <div class="brand-sm">JMS SALES</div>
      <div class="hdr-center">Revenue by State &nbsp;·&nbsp; ${CLINIC_PERIOD}</div>

    <div class="state-body">

        <div class="state-summary-card">
          <div class="ssc-label">2-Day Total Revenue</div>

        </div>

          <div class="ssc-label">Rx Volume</div>

          <div class="ssc-sub">Per ordering clinic</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ─── RENDER ───────────────────────────────────────────────────────
function render() {
  let html = slideLeaderboard() + slideWeeklyTrend() + slidePVA();
  reps.forEach((r,i) => html += slideRep(r,i));
  html += slideClinicLeaderboard() + slideClinicCards() + slideStateBreakdown();
  document.getElementById('slideshow').innerHTML = html;
}

// ─── SLIDESHOW LOGIC ──────────────────────────────────────────────
let cur=0, total=0, timer=null;

function goTo(n) {
  document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===n));
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===n));
  cur=n; startProgress();
}
function next() { goTo((cur+1)%total); }
function prev() { clearTimeout(timer); goTo((cur-1+total)%total); }

function startProgress() {
  clearTimeout(timer);
  const bar = document.getElementById('progressBar');
  bar.style.transition='none'; bar.style.width='0%';
  bar.offsetWidth; // reflow
  bar.style.transition=`width ${DURATION}ms linear`; bar.style.width='100%';
  timer = setTimeout(next, DURATION);
}

function buildIndicators(n) {
  document.getElementById('indicators').innerHTML =
    Array.from({length:n},(_,i)=>`<div class="dot" onclick="goTo(${i})"></div>`).join('');
}

// ─── INIT ─────────────────────────────────────────────────────────
// Slideshow is initialized after password is entered (see checkPass above)

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key===' ') next();
  if (e.key==='ArrowLeft') prev();
});
</script>
