<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JMS Sales Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090d;--bg2:#0f1018;--bg3:#141820;
  --gold:#c9a227;--gold2:#a07c10;--gold3:#f0d060;
  --cream:#ede8dc;--cream2:#c8c0ae;
  --orange:#ff8c3a;--orange2:#e06010;
  --c0:#c9a227;--c1:#4a9eca;--c2:#3dba6d;--c3:#c47a3e;
  --up:#27ae60;--dn:#ff5252;
  --border:rgba(201,162,39,.13);
  --glass:rgba(201,162,39,.04);
}
body.light{
  --bg:#f5f0e8;--bg2:#ede8dc;--bg3:#e0d8c8;
  --cream:#1a1510;--cream2:#3a3020;
  --border:rgba(100,80,20,.18);
  --glass:rgba(100,80,20,.06);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:'Segoe UI',system-ui,sans-serif;}

/* ── GATE ─────────────────────────────────────── */
#gate{position:fixed;inset:0;z-index:9000;display:flex;align-items:stretch;background:#050508;}
.gate-left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0c14 0%,#060810 100%);position:relative;overflow:hidden;}
.gate-right{width:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 40px;background:#08080f;border-left:1px solid rgba(201,162,39,.12);}
.sunburst{width:320px;height:320px;opacity:.18;animation:spin 60s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.gate-logo{position:absolute;font-size:2.8rem;font-weight:900;letter-spacing:.04em;color:#c9a227;text-shadow:0 0 40px rgba(201,162,39,.5);}
.gate-logo span{color:#ff8c3a;}
.gate-title{font-size:1.1rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(201,162,39,.7);margin-bottom:8px;}
.gate-sub{font-size:.75rem;color:rgba(200,180,130,.35);letter-spacing:.1em;margin-bottom:48px;}
.gate-input-wrap{width:100%;margin-bottom:16px;position:relative;}
.gate-input-wrap input{width:100%;padding:16px 20px;background:rgba(201,162,39,.06);border:1px solid rgba(201,162,39,.2);border-radius:10px;font-size:1.2rem;font-weight:700;letter-spacing:.3em;text-align:center;color:#c9a227;outline:none;transition:border-color .2s;}
.gate-input-wrap input:focus{border-color:rgba(201,162,39,.6);}
.gate-input-wrap input::placeholder{letter-spacing:.1em;color:rgba(201,162,39,.25);font-weight:400;font-size:.85rem;}
#gateBtn{width:100%;padding:16px;background:linear-gradient(135deg,#c9a227,#a07c10);border:none;border-radius:10px;font-size:1rem;font-weight:900;letter-spacing:.2em;color:#09090d;cursor:pointer;transition:opacity .2s;}
#gateBtn:hover{opacity:.85;}
#gateErr{color:#ff5252;font-size:.8rem;margin-top:12px;height:20px;text-align:center;}

/* ── APP ──────────────────────────────────────── */
#app{display:none;flex-direction:column;width:100vw;height:100vh;}

/* ── TICKER ───────────────────────────────────── */
#ticker{height:38px;background:rgba(0,0,0,.6);border-bottom:1px solid var(--border);display:flex;align-items:center;flex-shrink:0;overflow:hidden;}
.ticker-label{padding:0 16px;font-size:.65rem;font-weight:800;letter-spacing:.2em;color:var(--orange);white-space:nowrap;border-right:1px solid var(--border);}
.ticker-scroll{flex:1;overflow:hidden;position:relative;}
.ticker-inner{display:flex;gap:60px;white-space:nowrap;width:max-content;animation:tick 24s linear infinite;}
.ticker-inner:hover{animation-play-state:paused;}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{font-size:.72rem;font-weight:600;letter-spacing:.03em;color:var(--cream2);}
.ticker-item strong{color:var(--cream);}
.ti-up{color:var(--up);}.ti-dn{color:var(--dn);}

/* ── SLIDESHOW ────────────────────────────────── */
#slideshow{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .55s ease,transform .55s ease;}
.slide.active{opacity:1;transform:translateY(0);pointer-events:all;}
.slide.exit{opacity:0;transform:translateY(-16px);}

/* ── SLIDE HEADER ─────────────────────────────── */
.slide-hdr{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--border);flex-shrink:0;}
.slide-hdr-left{display:flex;align-items:center;gap:14px;}
.slide-title{font-size:.9rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--cream2);}
.slide-badge{background:var(--glass);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:.63rem;font-weight:700;letter-spacing:.12em;color:var(--gold);}
.slide-hdr-right{display:flex;gap:20px;font-size:.68rem;color:var(--cream2);}
.slide-hdr-right span{display:flex;align-items:center;gap:5px;}
.slide-hdr-right strong{color:var(--cream);}

/* ── SLIDE BODY ───────────────────────────────── */
.slide-body{flex:1;display:flex;overflow:hidden;}

/* ── OVERVIEW SLIDE ───────────────────────────── */
.ov-wrap{flex:1;display:grid;grid-template-rows:auto 1fr;padding:24px 40px;gap:20px;}
.ov-kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
.ov-kpi{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:18px 16px;text-align:center;}
.ov-kpi-lbl{font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--cream2);margin-bottom:8px;}
.ov-kpi-val{font-size:1.6rem;font-weight:900;color:var(--cream);}
.ov-kpi-val.gold{color:var(--gold);}
.ov-kpi-chg{font-size:.7rem;margin-top:6px;}
.ov-kpi-chg.up{color:var(--up);}.ov-kpi-chg.dn{color:var(--dn);}
.ov-reps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.ov-rep{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:10px;}
.ov-rep-name{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
.ov-rep-rev{font-size:1.8rem;font-weight:900;}
.ov-rep-stats{display:flex;gap:12px;font-size:.7rem;color:var(--cream2);}
.ov-rep-stats span{display:flex;flex-direction:column;gap:2px;}
.ov-rep-stats strong{color:var(--cream);font-size:.82rem;}
.ov-bar-bg{background:rgba(255,255,255,.07);border-radius:4px;height:6px;width:100%;}
.ov-bar-fill{height:100%;border-radius:4px;transition:width 1s ease;}
.ov-share{font-size:.65rem;color:var(--cream2);margin-top:2px;}

/* ── MOMENTUM BOARD ───────────────────────────── */
.mb-wrap{flex:1;display:grid;grid-template-rows:1fr 1fr;padding:20px 40px;gap:16px;}
.mb-section{display:flex;flex-direction:column;gap:8px;}
.mb-section-title{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cream2);padding-bottom:6px;border-bottom:1px solid var(--border);}
.mb-row{display:grid;grid-template-columns:160px 1fr 1fr 1fr;gap:0;align-items:center;background:var(--glass);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.mb-row.header{background:transparent;border:none;border-radius:0;}
.mb-name{padding:12px 16px;font-size:.78rem;font-weight:700;border-right:1px solid var(--border);}
.mb-name.team{font-size:.85rem;font-weight:900;color:var(--gold);}
.mb-cell{padding:12px 16px;text-align:center;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;}
.mb-cell:last-child{border-right:none;}
.mb-cell-lbl{font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(200,180,130,.4);}
.mb-cell-val{font-size:1.4rem;font-weight:900;}
.mb-cell-val.team-val{font-size:1.8rem;color:var(--gold);}
.mb-cell-chg{font-size:.72rem;font-weight:700;}
.mb-cell-chg.up{color:var(--up);}.mb-cell-chg.dn{color:var(--dn);}

/* ── LEADERBOARD ──────────────────────────────── */
.lb-wrap{flex:1;display:flex;flex-direction:column;padding:20px 40px;gap:10px;}
.lb-row{display:grid;grid-template-columns:52px 1fr 110px 110px 1fr 160px 110px;gap:0;align-items:center;}
.lb-row.header{background:transparent!important;border:none!important;}
.lb-row.header .lb-cell{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(200,180,130,.4);padding:8px 14px;}
.lb-row:not(.header){background:var(--glass);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:background .2s;}
.lb-row:not(.header):hover{background:rgba(201,162,39,.07);}
.lb-cell{padding:14px 14px;}
.lb-rank{font-size:1.6rem;text-align:center;}
.lb-name{display:flex;flex-direction:column;gap:3px;}
.lb-name-main{font-size:.88rem;font-weight:800;}
.lb-name-sub{font-size:.63rem;color:var(--cream2);}
.lb-wow,.lb-avg,.lb-rev,.lb-ord{font-size:.88rem;font-weight:700;text-align:right;}
.lb-bar-cell{padding:14px 14px;}
.lb-bar-bg{background:rgba(255,255,255,.07);border-radius:4px;height:8px;}
.lb-bar-fill{height:100%;border-radius:4px;transition:width 1s ease;}
.lb-rev{font-size:1.05rem;font-weight:900;}

/* ── REP SPOTLIGHT ────────────────────────────── */
.theme-0{--ac:var(--c0);--ac2:#a07c10;}
.theme-1{--ac:var(--c1);--ac2:#1f6fa0;}
.theme-2{--ac:var(--c2);--ac2:#1a8a45;}
.theme-3{--ac:var(--c3);--ac2:#8a4e1a;}
.rep-body{flex:1;display:flex;flex-direction:column;padding:0 40px 16px;gap:0;}
.rep-hero{display:flex;align-items:center;gap:16px;padding:14px 0 14px;border-bottom:1px solid var(--border);}
.rep-rank-badge{font-size:2rem;}
.rep-hero-name{font-size:1.7rem;font-weight:900;color:var(--ac);}
.rep-hero-stats{display:flex;gap:20px;margin-left:auto;}
.rep-hero-stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
.rep-hero-stat-lbl{font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cream2);}
.rep-hero-stat-val{font-size:1.1rem;font-weight:900;color:var(--cream);}
.rep-kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:14px 0;}
.rep-kpi-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:14px;padding:16px 20px;position:relative;overflow:hidden;}
.rep-kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac);}
.rep-kpi-lbl{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cream2);margin-bottom:6px;}
.rep-kpi-val{font-size:2rem;font-weight:900;line-height:1;margin-bottom:6px;color:var(--cream);}
.rep-kpi-chg{font-size:.8rem;font-weight:700;}
.rep-kpi-chg.up{color:var(--up);}.rep-kpi-chg.dn{color:var(--dn);}
.rep-kpi-sub{font-size:.65rem;color:var(--cream2);margin-top:4px;}
.rep-details-row{flex:1;display:grid;grid-template-columns:1.6fr 1fr;gap:14px;border-top:1px solid var(--border);padding-top:14px;min-height:0;}
.rep-spark-wrap{display:flex;flex-direction:column;gap:8px;}
.rep-spark-title{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cream2);}
.spark-svg{width:100%;height:80px;}
.rep-drugs{display:flex;flex-direction:column;gap:6px;}
.rep-drug{display:flex;align-items:center;gap:8px;}
.rep-drug-rank{font-size:.65rem;color:var(--cream2);width:16px;text-align:right;}
.rep-drug-name{font-size:.72rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rep-drug-rev{font-size:.72rem;font-weight:700;color:var(--ac);white-space:nowrap;}
.rep-drug-bar-bg{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:2px;}
.rep-drug-bar-fill{height:100%;border-radius:2px;background:var(--ac);}
.rep-meta{display:flex;flex-direction:column;gap:8px;}
.rep-meta-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);}
.rep-meta-lbl{font-size:.65rem;letter-spacing:.08em;color:var(--cream2);}
.rep-meta-val{font-size:.82rem;font-weight:700;}
.rep-meta-val.good{color:var(--up);}.rep-meta-val.bad{color:var(--dn);}

/* ── WEEKLY TREND ─────────────────────────────── */
.chart-wrap{flex:1;padding:16px 40px;display:flex;flex-direction:column;gap:10px;}
.chart-legend{display:flex;gap:20px;flex-wrap:wrap;}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--cream2);}
.chart-legend-dot{width:10px;height:10px;border-radius:50%;}
.chart-svg{flex:1;width:100%;min-height:0;}

/* ── MoM ──────────────────────────────────────── */
.mom-wrap{flex:1;padding:16px 40px;display:flex;flex-direction:column;gap:10px;}
.mom-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex-shrink:0;}
.mom-kpi{background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center;}
.mom-kpi-lbl{font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;color:var(--cream2);margin-bottom:6px;}
.mom-kpi-val{font-size:1.3rem;font-weight:900;}
.mom-chart-svg{flex:1;width:100%;}

/* ── TERRITORY MAP ────────────────────────────── */
.map-wrap{flex:1;display:grid;grid-template-columns:1fr 280px;gap:0;}
.map-svg-wrap{flex:1;padding:10px 20px;}
#map-svg{width:100%;height:100%;}
.map-sidebar{padding:16px;border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
.map-state-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(201,162,39,.05);}
.map-state-rank{font-size:.6rem;color:var(--cream2);width:18px;}
.map-state-name{font-size:.72rem;flex:1;}
.map-state-rev{font-size:.72rem;font-weight:700;color:var(--gold);}
.map-state-bar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:2px;}
.map-state-fill{height:100%;border-radius:2px;background:var(--gold);}

/* ── TOP ACCOUNTS ─────────────────────────────── */
.acct-wrap{flex:1;padding:16px 40px;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow-y:auto;}
.acct-row{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:10px 14px;}
.acct-rank{font-size:.8rem;font-weight:900;color:var(--cream2);width:22px;}
.acct-info{flex:1;min-width:0;}
.acct-name{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acct-sub{font-size:.63rem;color:var(--cream2);margin-top:2px;}
.acct-rev{font-size:.92rem;font-weight:900;color:var(--gold);white-space:nowrap;}
.acct-rx{font-size:.65rem;color:var(--cream2);}

/* ── NEW ACCOUNTS ─────────────────────────────── */
.new-wrap{flex:1;padding:16px 40px;display:flex;flex-direction:column;gap:16px;}
.new-hero{text-align:center;padding:16px 0;}
.new-hero-num{font-size:5rem;font-weight:900;color:var(--gold);line-height:1;}
.new-hero-lbl{font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cream2);margin-top:6px;}
.new-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start;}
.new-card{background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;}
.new-card-name{font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.new-card-rep{font-size:.63rem;font-weight:700;}
.new-card-sub{font-size:.63rem;color:var(--cream2);}
.new-card-rev{font-size:.85rem;font-weight:900;color:var(--up);margin-top:4px;}

/* ── NAV DOTS ─────────────────────────────────── */
#navDots{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:100;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(201,162,39,.2);cursor:pointer;transition:all .25s;}
.dot.active{background:var(--gold);transform:scale(1.3);}
.dot:hover{background:rgba(201,162,39,.5);}

/* ── CONTROLS ─────────────────────────────────── */
#pauseIndicator{position:fixed;bottom:82px;right:20px;z-index:9999;background:rgba(10,16,32,.95);border:1px solid var(--orange);border-radius:8px;padding:6px 14px;font-size:.7rem;color:var(--orange);font-weight:800;letter-spacing:.12em;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;}
#pauseIndicator.show{opacity:1;}
#themeToggle{position:fixed;bottom:36px;right:20px;z-index:9999;background:rgba(20,28,50,.97);border:2px solid rgba(255,255,255,.4);border-radius:99px;padding:8px 18px;cursor:pointer;font-size:.78rem;font-weight:700;letter-spacing:.07em;color:#ddd;transition:all .2s;display:none;gap:7px;align-items:center;}
#themeToggle.visible{display:flex;}
#themeToggle:hover{border-color:var(--gold);color:var(--gold);}
#slideProgress{position:fixed;bottom:0;left:0;height:2px;background:var(--gold);z-index:200;transition:width linear;}
</style>
</head>
<body>

<!-- GATE -->
<div id="gate">
  <div class="gate-left">
    <svg class="sunburst" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(160,160)" fill="none" stroke="#c9a227" stroke-width="1">
        <circle r="60"/><circle r="90"/><circle r="120"/><circle r="150"/>
        <script type="text/javascript">void 0;</script>
      </g>
      <!-- rays -->
      <g transform="translate(160,160)" stroke="#c9a227" stroke-width="1">
        <line x1="0" y1="-155" x2="0" y2="155"/>
        <line x1="-155" y1="0" x2="155" y2="0"/>
        <line x1="-110" y1="-110" x2="110" y2="110"/>
        <line x1="110" y1="-110" x2="-110" y2="110"/>
        <line x1="-60" y1="-145" x2="60" y2="145"/>
        <line x1="145" y1="-60" x2="-145" y2="60"/>
        <line x1="60" y1="-145" x2="-60" y2="145"/>
        <line x1="145" y1="60" x2="-145" y2="-60"/>
        <line x1="-30" y1="-152" x2="30" y2="152"/>
        <line x1="152" y1="-30" x2="-152" y2="30"/>
        <line x1="30" y1="-152" x2="-30" y2="152"/>
        <line x1="152" y1="30" x2="-152" y2="-30"/>
      </g>
    </svg>
    <div class="gate-logo">BOOM<span>RX</span></div>
  </div>
  <div class="gate-right">
    <div class="gate-title">JMS Sales Command</div>
    <div class="gate-sub">AUTHORIZED ACCESS ONLY</div>
    <div class="gate-input-wrap">
      <input id="pwInput" type="password" placeholder="Enter access code" autocomplete="off" maxlength="20">
    </div>
    <button id="gateBtn">ENTER</button>
    <div id="gateErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- TICKER -->
  <div id="ticker">
    <div class="ticker-label">▶ LIVE</div>
    <div class="ticker-scroll">
      <div class="ticker-inner" id="tickerInner"></div>
    </div>
  </div>

  <!-- SLIDES -->
  <div id="slideshow"></div>

  <!-- NAV DOTS -->
  <div id="navDots"></div>

  <!-- CONTROLS -->
  <div id="pauseIndicator">⏸ PAUSED</div>
  <button id="themeToggle" class="visible">☀ LIGHT</button>
  <div id="slideProgress"></div>
</div>

    const chg = dod.yday>0?pct(dod.today,dod.yday):null;
    const ar  = arrow(chg);
    return `<span class="ticker-item"><strong>${r.short}</strong> &nbsp;YTD ${fmt(r.revenue||0)} &nbsp;${ar} &nbsp;·&nbsp; ${(r.orders||0).toLocaleString()} orders &nbsp;·&nbsp; ${r.clinics||0} clinics</span>`;
  });
  const todayTot = daily[daily.length-1].tot;
  const ydayTot  = daily[daily.length-2].tot;
  const dodPct   = pct(todayTot,ydayTot);
  const wowPct   = pct(wowData.cur,wowData.prev);
  const momPct   = pct(momData.cur,momData.prev);
  const teamItems = [
    `<span class="ticker-item"><strong>TEAM TODAY</strong> &nbsp;${fmt(todayTot)} &nbsp;${arrow(dodPct)} vs yesterday</span>`,
    `<span class="ticker-item"><strong>THIS WEEK</strong> &nbsp;${fmt(wowData.cur)} &nbsp;${arrow(wowPct)} vs last wk</span>`,
    `<span class="ticker-item"><strong>THIS MONTH</strong> &nbsp;${fmt(momData.cur)} &nbsp;${arrow(momPct)} vs prior period</span>`,
    `<span class="ticker-item"><strong>TEAM YTD</strong> &nbsp;${fmtFull(totalRevenue)} &nbsp;·&nbsp; ${totalOrders.toLocaleString()} orders &nbsp;·&nbsp; ${totalAccounts} clinics</span>`,
  ];
  const clinicItems = topClinics.slice(0,8).map(c=>
    `<span class="ticker-item"><strong>${c.name}</strong> &nbsp;<span style="color:#666">${c.state}</span>&nbsp; ${fmt(c.revenue)} &nbsp;·&nbsp; ${c.rx} Rx &nbsp;·&nbsp; <span style="color:#666">${c.rep.split(' ')[0]}</span></span>`
  );
  const newItems = newAccounts7d.map(a=>
    `<span class="ticker-item" style="color:#3dba6d"><strong>★ NEW</strong> &nbsp;${a.clinic} &nbsp;<span style="color:#666">${a.state} · ${a.rep.split(' ')[0]}</span></span>`
  );
  const drugItems = reps.map(r=>{
    const d = r.topDrugs&&r.topDrugs[0];
    if(!d) return '';
    return `<span class="ticker-item"><strong>${r.short}</strong> &nbsp;top Rx: ${d.name} &nbsp;${fmt(d.rev)}</span>`;
  }).filter(Boolean);
  const all = [...repItems,sep,...teamItems,sep,...clinicItems,sep,...newItems,sep,...drugItems,sep];
  const SP = '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
  const half = all.join(SP);
  document.getElementById('tickerInner').innerHTML = half+SP+half;
}

// ── RENDER SLIDES ──────────────────────────────────────────────────
function render(){
  let html = slideOverview() + slideMomentum() + slideLeaderboard();
  reps.forEach((r,i)=>html+=slideRep(r,i));
  html += slideWeeklyTrend() + slideMoM() + slideStateMap() + slideTopAccounts() + slideNewAccounts();
  document.getElementById('slideshow').innerHTML = html;
  // Nav dots
  const dots = document.getElementById('navDots');
  dots.innerHTML = SLIDE_NAMES.map((_,i)=>`<div class="dot${i===0?' active':''}" onclick="goTo(${i})"></div>`).join('');
  // Charts (after DOM)
  setTimeout(()=>{
    drawWeeklyChart();
    drawMoMChart();
    drawSparklines();
    initMap();
    countUp();
    buildProgressBars();
  }, 80);
}

function slideMomentum(){

// ── CHARTS ─────────────────────────────────────────────────────────
function drawWeeklyChart(){
  const svg = document.getElementById('weeklyChart');
  if(!svg) return;
  const W = svg.parentElement.clientWidth||900, H = svg.parentElement.clientHeight||220;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const weeks = DATA.weekly;
  const n = weeks.length;
  const maxV = Math.max(...weeks.map(w=>w.tot||0))||1;
  const pad = {l:50,r:20,t:20,b:30};
  const cW = W-pad.l-pad.r, cH = H-pad.t-pad.b;

  let html = '';
  // Grid lines
  for(let i=0;i<=4;i++){
    const y = pad.t + cH - (i/4)*cH;
    const val = maxV*(i/4);
    html += `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="rgba(200,170,100,.07)" stroke-width="1"/>`;
    html += `<text x="${pad.l-6}" y="${y+4}" text-anchor="end" font-size="9" fill="rgba(200,170,100,.4)">${fmt(val)}</text>`;
  }

  // Stacked area per rep
  const repCols = ['#c9a227','#4a9eca','#3dba6d','#c47a3e'];
  const repKeys = ['Erin Ryan Snyder','Zachary Salazar','Dylan White','Jonathan Izquierdo'];

  // Build stacked paths
  const stackedPath = (repIdx)=>{
    const pts = weeks.map((w,i)=>{
      const x = pad.l + (i/(n-1))*cW;
      let base = 0;
      for(let j=0;j<repIdx;j++) base += w[repKeys[j]]||0;
      const cur  = base + (w[repKeys[repIdx]]||0);
      const curY = pad.t + cH - (cur/maxV)*cH;
      return {x, y:curY, base: pad.t + cH - (base/maxV)*cH};
    });
    const top   = pts.map(p=>`${p.x},${p.y}`).join(' ');
    const bottom = [...pts].reverse().map(p=>`${p.x},${p.base}`).join(' ');
    return `<polygon points="${top} ${bottom}" fill="${repCols[repIdx]}" opacity="0.35"/>`;
  };

  for(let i=3;i>=0;i--) html += stackedPath(i);

  // Total line
  const totalLine = weeks.map((w,i)=>{
    const x = pad.l + (i/(n-1))*cW;
    const y = pad.t + cH - ((w.tot||0)/maxV)*cH;
    return `${i===0?'M':'L'}${x},${y}`;
  }).join(' ');
  html += `<path d="${totalLine}" fill="none" stroke="rgba(201,162,39,.6)" stroke-width="2"/>`;

  // X labels (every ~8 weeks)
  weeks.forEach((w,i)=>{
    if(i%8===0||i===n-1){
      const x = pad.l + (i/(n-1))*cW;
      html += `<text x="${x}" y="${H-6}" text-anchor="middle" font-size="8" fill="rgba(200,170,100,.4)">${w.week.slice(5)}</text>`;
    }
  });

  svg.innerHTML = html;

  // Update header stats
  const peak = Math.max(...weeks.map(w=>w.tot||0));
  const avg  = weeks.reduce((a,w)=>a+(w.tot||0),0)/weeks.filter(w=>w.tot>0).length;
  const peakEl = document.getElementById('weekly-peak');
  const avgEl  = document.getElementById('weekly-avg');
  if(peakEl) peakEl.textContent = fmt(peak);
  if(avgEl)  avgEl.textContent  = fmt(avg);
}

function drawMoMChart(){
  const svg = document.getElementById('momChart');
  if(!svg) return;
  const W = svg.parentElement.clientWidth||900, H = svg.parentElement.clientHeight||160;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const months = DATA.monthly;
  const n = months.length;
  const maxV = Math.max(...months.map(m=>m.tot||0))||1;
  const pad = {l:55,r:20,t:20,b:30};
  const cW = W-pad.l-pad.r, cH = H-pad.t-pad.b;
  const bW  = cW/n - 4;
  let html = '';

  // Grid
  for(let i=0;i<=4;i++){
    const y = pad.t + cH - (i/4)*cH;
    html += `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="rgba(200,170,100,.07)" stroke-width="1"/>`;
    html += `<text x="${pad.l-6}" y="${y+4}" text-anchor="end" font-size="9" fill="rgba(200,170,100,.4)">${fmt(maxV*(i/4))}</text>`;
  }

  // Stacked bars
  const repKeys = ['Erin Ryan Snyder','Zachary Salazar','Dylan White','Jonathan Izquierdo'];
  const repCols = ['#c9a227','#4a9eca','#3dba6d','#c47a3e'];
  months.forEach((m,i)=>{
    const x = pad.l + i*(cW/n) + 2;
    let base = 0;
    repKeys.forEach((k,ri)=>{
      const v = m[k]||0;
      const h = (v/maxV)*cH;
      const y = pad.t + cH - base*(cH/maxV) - h;
      if(h>0) html += `<rect x="${x}" y="${y}" width="${bW}" height="${h}" fill="${repCols[ri]}" opacity="0.8" rx="2"/>`;
      base += v;
    });
    // Label
    html += `<text x="${x+bW/2}" y="${H-6}" text-anchor="middle" font-size="8" fill="rgba(200,170,100,.45)">${m.label}</text>`;
    // Value on top
    const totH = (m.tot/maxV)*cH;
    if(m.tot>0){
      html += `<text x="${x+bW/2}" y="${pad.t+cH-totH-4}" text-anchor="middle" font-size="8" fill="rgba(200,170,100,.7)">${fmt(m.tot)}</text>`;
    }
  });

  svg.innerHTML = html;
}

// ── US MAP (D3 + TopoJSON) ─────────────────────────────────────────
let mapLoaded = false;
function initMap(){
  const mapSlide = document.getElementById('slide-9');
  if(!mapSlide) return;
  if(mapLoaded) return;

  const stateRevMap = {};
  DATA.state_data.forEach(s=>{ stateRevMap[s.state]=s.revenue; });
  const maxRev = Math.max(...Object.values(stateRevMap))||1;

  // Load D3 + TopoJSON dynamically
  const loadScript = (src)=>new Promise(res=>{
    if(document.querySelector(`script[src="${src}"]`)){res();return;}
    const s=document.createElement('script');
    s.src=src; s.onload=res; document.head.appendChild(s);
  });

  Promise.all([
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js'),
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js'),
  ]).then(()=>{
    fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
      .then(r=>r.json())
      .then(us=>{
        mapLoaded = true;
        const svg  = d3.select('#map-svg');
        const proj = d3.geoAlbersUsa().scale(900).translate([480,300]);
        const path = d3.geoPath().projection(proj);
        const states = topojson.feature(us, us.objects.states);
        const stateNames = {
          "01":"AL","02":"AK","04":"AZ","05":"AR","06":"CA","08":"CO","09":"CT",
          "10":"DE","11":"DC","12":"FL","13":"GA","15":"HI","16":"ID","17":"IL",
          "18":"IN","19":"IA","20":"KS","21":"KY","22":"LA","23":"ME","24":"MD",
          "25":"MA","26":"MI","27":"MN","28":"MS","29":"MO","30":"MT","31":"NE",
          "32":"NV","33":"NH","34":"NJ","35":"NM","36":"NY","37":"NC","38":"ND",
          "39":"OH","40":"OK","41":"OR","42":"PA","44":"RI","45":"SC","46":"SD",
          "47":"TN","48":"TX","49":"UT","50":"VT","51":"VA","53":"WA","54":"WV",
          "55":"WI","56":"WY"
        };
        svg.selectAll('path')
          .data(states.features)
          .join('path')
          .attr('d', path)
          .attr('fill', d=>{
            const abbr = stateNames[d.id.toString().padStart(2,'0')];
            const rev  = stateRevMap[abbr]||0;
            if(!rev) return 'rgba(255,255,255,.04)';
            const intens = rev/maxRev;
            return `rgba(201,162,39,${0.1+intens*0.85})`;
          })
          .attr('stroke','rgba(201,162,39,.2)')
          .attr('stroke-width','0.5');
      }).catch(()=>{
        document.getElementById('map-svg').innerHTML = '<text x="480" y="300" text-anchor="middle" fill="rgba(201,162,39,.4)" font-size="16">Map data unavailable offline</text>';
      });
  });
}

// ── COUNT-UP ───────────────────────────────────────────────────────
function countUp(){
  document.querySelectorAll('[data-cu]').forEach(el=>{
    const target = parseFloat(el.dataset.cu)||0;
    const isK    = el.dataset.cuK;
    const isPlain= el.dataset.cuPlain;
    const prefix = el.dataset.cuPrefix||'';
    const dur = 1200, fps=60, frames=dur/1000*fps;
    let f=0;
    const iv = setInterval(()=>{
      f++;
      const v = target*(f/frames);
      if(isPlain) el.textContent = Math.round(v).toLocaleString();
      else if(isK) el.textContent = prefix + (v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':v.toFixed(0));
      else el.textContent = prefix + Math.round(v).toLocaleString();
      if(f>=frames){ clearInterval(iv); }
    },1000/fps);
  });
}

function buildProgressBars(){
  // bars animate via CSS transition — just set widths to target
  document.querySelectorAll('[data-bar]').forEach(el=>{
    const w = el.dataset.bar;
    el.style.width = '0%';
    setTimeout(()=>{ el.style.width = w+'%'; },100);
  });
}

// ── SLIDE SHOW ─────────────────────────────────────────────────────
function goTo(idx){
  const slides = document.querySelectorAll('.slide');
  const dots   = document.querySelectorAll('.dot');
  if(currentSlide===idx) return;
  slides[currentSlide].classList.remove('active');
  slides[currentSlide].classList.add('exit');
  setTimeout(()=>slides[currentSlide]&&slides[currentSlide].classList.remove('exit'),600);
  currentSlide = idx;
  slides[currentSlide].classList.add('active');
  dots.forEach((d,i)=>d.classList.toggle('active',i===idx));
  resetProgress();
  // Draw charts when their slide becomes active
  if(idx===7) setTimeout(drawWeeklyChart,80);
  if(idx===8) setTimeout(drawMoMChart,80);
  if(idx===9) setTimeout(initMap,80);
}

function nextSlide(){
  goTo((currentSlide+1)%SLIDE_NAMES.length);
}

function startTimer(){
  clearTimeout(showTimer);
  timerRemaining = timerDuration;
  timerStart     = Date.now();
  showTimer = setTimeout(nextSlide, timerDuration);
}

function resetProgress(){
  const bar = document.getElementById('slideProgress');
  bar.style.transition='none';
  bar.style.width='0%';
  setTimeout(()=>{
    bar.style.transition=`width ${timerDuration}ms linear`;
    bar.style.width='100%';
  },20);
  startTimer();
}

function pauseShow(){
  if(paused) return;
  paused = true;
  timerRemaining -= (Date.now()-timerStart);
  clearTimeout(showTimer);
  document.getElementById('pauseIndicator').classList.add('show');
  const bar = document.getElementById('slideProgress');
  const w = parseFloat(bar.style.width)||0;
  bar.style.transition='none';
  bar.style.width=w+'%';
}

function resumeShow(){
  if(!paused) return;
  paused = false;
  document.getElementById('pauseIndicator').classList.remove('show');
  timerStart = Date.now();
  showTimer  = setTimeout(nextSlide, timerRemaining);
  const bar = document.getElementById('slideProgress');
  bar.style.transition=`width ${timerRemaining}ms linear`;
  bar.style.width='100%';
}

// ── GATE ───────────────────────────────────────────────────────────
function unlockApp(){
  document.getElementById('gate').style.display='none';
  const app = document.getElementById('app');
  app.style.display='flex';
  app.style.flexDirection='column';
  document.getElementById('themeToggle').classList.add('visible');
  buildTicker();
  render();
  // Show first slide
  setTimeout(()=>{
    const slides = document.querySelectorAll('.slide');
    if(slides[0]) slides[0].classList.add('active');
    resetProgress();
  },50);
}

document.getElementById('gateBtn').addEventListener('click',()=>{
  const pw = document.getElementById('pwInput').value.toUpperCase().trim();
  if(pw==='LFGBOCA'){ unlockApp(); }
  else{ document.getElementById('gateErr').textContent='Invalid access code'; setTimeout(()=>document.getElementById('gateErr').textContent='',2000); }
});
document.getElementById('pwInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('gateBtn').click(); });

// ── THEME TOGGLE ───────────────────────────────────────────────────
let lightMode = localStorage.getItem('jms_light')==='1';
function applyTheme(){
  document.body.classList.toggle('light', lightMode);
  document.getElementById('themeToggle').textContent = lightMode?'🌙 DARK':'☀ LIGHT';
}
document.getElementById('themeToggle').addEventListener('click',()=>{
  lightMode=!lightMode;
  localStorage.setItem('jms_light',lightMode?'1':'0');
  applyTheme();
});
applyTheme();

// ── HOVER PAUSE ────────────────────────────────────────────────────
const slideshow = document.getElementById('slideshow');
// Use event delegation after render
document.addEventListener('mouseover',e=>{
  if(e.target.closest('#slideshow')) pauseShow();
});
document.addEventListener('mouseout',e=>{
  if(e.target.closest('#slideshow') && !e.relatedTarget?.closest('#slideshow')) resumeShow();
});

// ── KEYBOARD ───────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') nextSlide();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') goTo((currentSlide-1+SLIDE_NAMES.length)%SLIDE_NAMES.length);
  if(e.key===' '){e.preventDefault(); paused?resumeShow():pauseShow();}
});
