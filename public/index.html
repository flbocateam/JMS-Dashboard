<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>JMS Dashboards</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .wrap { text-align: center; }
  h1 { color: #f1f5f9; font-size: 22px; font-weight: 600; margin-bottom: 28px; }
  .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  a.card {
    display: block;
    width: 220px;
    padding: 24px 20px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    color: #e2e8f0;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: #60a5fa; transform: translateY(-2px); }
  a.card .sub { display: block; margin-top: 6px; font-weight: 400; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>JMS Dashboards</h1>
    <div class="links">
      <a class="card" href="/sales">Sales Dashboard<span class="sub">Revenue, orders, reps</span></a>
      <a class="card" href="/transfer">Jack / Mark Transfer Tracker<span class="sub">32-account handoff status</span></a>
    </div>
  </div>
</body>
</html>
